<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240, height=320, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WiFi Pineapple Detection Results</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
      --nord0: #2E3440;
      --nord1: #3B4252;
      --nord2: #434C5E;
      --nord3: #4C566A;
      --nord4: #D8DEE9;
      --nord5: #E5E9F0;
      --nord6: #ECEFF4;
      --nord7: #8FBCBB;
      --nord8: #88C0D0;
      --nord9: #81A1C1;
      --nord10: #5E81AC;
      --nord11: #BF616A;
      --nord12: #D08770;
      --nord13: #EBCB8B;
      --nord14: #A3BE8C;
      --nord15: #B48EAD;
    }
    body {
      background: var(--nord0);
      color: var(--nord4);
      font-family: 'Montserrat', Arial, Helvetica, sans-serif;
      padding: 10px;
    }
    .result {
      background: var(--nord2);
      padding: 8px;
      border-radius: 6px;
      word-break: break-all;
    }
    .btn {
      margin-top: 12px;
      padding: 8px 16px;
      background: var(--nord8);
      color: var(--nord0);
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .btn:hover {
      background: var(--nord9);
    }
</style>
</head>
<body>
<h2>WiFi Pineapple Detection Results</h2>
<div class="result" id="result">Loading...</div>
<button class="btn" onclick="location.href='success.html'">Back to Dashboard</button>
<script>
function apiJson(method, url, cb) {
  var xhr = new XMLHttpRequest();
  xhr.open(method, url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status < 200 || xhr.status >= 300) {
      cb(new Error('HTTP ' + xhr.status), null);
      return;
    }
    try {
      cb(null, JSON.parse(xhr.responseText));
    } catch (e) {
      cb(e, null);
    }
  };
  xhr.send(null);
}

document.getElementById('result').innerHTML = '<span style="color:#BF616A;">Not supported on this device (no monitor mode)</span>';
</script>
</body>
</html>
