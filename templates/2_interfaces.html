<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=240, height=320, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interface Status</title>
    <style>
        :root {
          --nord0: #2E3440;
          --nord1: #3B4252;
          --nord2: #434C5E;
          --nord3: #4C566A;
          --nord4: #D8DEE9;
          --nord5: #E5E9F0;
          --nord6: #ECEFF4;
          --nord7: #8FBCBB;
          --nord8: #88C0D0;
          --nord9: #81A1C1;
          --nord10: #5E81AC;
          --nord11: #BF616A;
          --nord12: #D08770;
          --nord13: #EBCB8B;
          --nord14: #A3BE8C;
          --nord15: #B48EAD;
        }
        html, body {
            width: 240px;
            height: 320px;
            margin: 0;
            padding: 0;
            background: var(--nord0);
            color: var(--nord4);
            font-family: Arial, Helvetica, sans-serif;
            overflow-y: auto;
            -webkit-text-size-adjust: none;
            text-size-adjust: none;
        }
        .container {
            width: 224px;
            margin: 8px auto 0 auto;
            padding: 8px 4px 12px 4px;
            background: var(--nord1);
            border-radius: 8px;
        }
        h1 {
            color: var(--nord8);
            font-size: 16px;
            margin: 0 0 8px 0;
            text-align: center;
            font-family:'Cinzel Decorative', 'UnifrakturCook', serif;
            text-shadow:0 1px 2px var(--nord3);
        }
        .iface {
            display: block;
            margin-bottom: 10px;
            padding: 10px 4px;
            background: var(--nord2);
            border-radius: 6px;
            font-size: 15px;
        }
        .up { color: var(--nord14); font-weight: bold; }
        .down { color: var(--nord11); font-weight: bold; }
        .info {
            color: var(--nord8);
            font-size: 13px;
            margin-bottom: 4px;
        }
        .back {
            display: block;
            margin: 12px auto 0 auto;
            text-align: center;
            color: var(--nord8);
            background: var(--nord3);
            border-radius: 4px;
            padding: 10px 0;
            width: 100%;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            border: 1px solid var(--nord8);
            transition: background .15s, color .15s, border .15s;
        }
        .back:focus, .back:hover {
            background: var(--nord8);
            color: var(--nord0);
            border: 1px solid var(--nord8);
        }
        button {
            margin-top:6px;
            padding:6px 12px;
            background: var(--nord0);
            color: var(--nord8);
            border:1px solid var(--nord8);
            border-radius:4px;
            cursor:pointer;
            font-size:13px;
            font-weight:bold;
            transition: background .15s, color .15s, border .15s;
        }
        button:focus, button:hover {
            background: var(--nord8);
            color: var(--nord0);
            border: 1px solid var(--nord8);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Interface Status</h1>
        <div id="iface-list">Loading...</div>
        <a href="success.html" class="back">&lt; DASHBOARD</a>
    </div>
    <script>
    function apiJson(method, url, cb) {
        var xhr = new XMLHttpRequest();
        xhr.open(method, url, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState !== 4) return;
            if (xhr.status < 200 || xhr.status >= 300) {
                cb(new Error('HTTP ' + xhr.status), null);
                return;
            }
            try {
                cb(null, JSON.parse(xhr.responseText));
            } catch (e) {
                cb(e, null);
            }
        };
        xhr.send(null);
    }

    function esc(s) {
        s = (s === null || s === undefined) ? '' : String(s);
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function fetchStatus() {
        apiJson('GET', '/api/interfaces/status', function(err, data) {
            if (err) {
                document.getElementById('iface-list').innerHTML = 'Error loading interfaces.';
                return;
            }
            var html = '';
            var interfaces = data && data.interfaces ? data.interfaces : null;
            if (interfaces) {
                for (var name in interfaces) {
                    if (!interfaces.hasOwnProperty(name)) continue;
                    var info = interfaces[name] || {};
                    var stateText = info.state ? String(info.state).toUpperCase() : 'UNKNOWN';
                    var stateClass = info.state ? esc(info.state) : '';
                    html += "<div class='iface'><div><b>" + esc(name) + "</b></div>";
                    html += "<div class='info'>Type: " + esc(info.type || 'N/A') + " | MAC: " + esc(info.mac || 'N/A') + "</div>";
                    html += "<div>Status: <span class='" + stateClass + "'>" + esc(stateText) + "</span></div>";
                    html += "<button style='margin-top:6px;padding:6px 12px;background:#222;color:#0cf;border:1px solid #0cf;border-radius:4px;cursor:pointer;' onclick=\"enableMonitor('" + esc(name) + "')\">Enable Monitor Mode</button>";
                    html += "</div>";
                }
            } else {
                html = 'No interface data.';
            }
            document.getElementById('iface-list').innerHTML = html;
        });
    }

    function enableMonitor(iface) {
        if (!confirm('Enable monitor mode on ' + iface + '?')) return;
        apiJson('POST', '/api/interfaces/' + encodeURIComponent(iface) + '/monitor/start', function(err, data) {
            if (err) {
                alert('Error: ' + err);
                return;
            }
            if (data && data.ok) {
                alert('Monitor mode enabled: ' + (data.monitor_interface || iface));
                fetchStatus();
            } else {
                alert('Error: ' + ((data && data.error) ? data.error : 'Failed'));
            }
        });
    }

    setInterval(fetchStatus, 2000);
    fetchStatus();
    </script>
</body>
</html>
