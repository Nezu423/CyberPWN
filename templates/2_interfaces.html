<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=240, height=320, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interface Status</title>
    <style>
        :root {
          --nord0: #000000;
          --nord1: #000000;
          --nord2: #000000;
          --nord3: #202020;
          --nord4: #EAEAEA;
          --nord5: #EAEAEA;
          --nord6: #EAEAEA;
          --nord7: #00FFE7;
          --nord8: #00FFE7;
          --nord9: #FF00C8;
          --nord10: #00FFE7;
          --nord11: #FF3C00;
          --nord12: #FFD600;
          --nord13: #FFD600;
          --nord14: #00FF5A;
          --nord15: #FF00C8;
        }
        html, body {
            width: 240px;
            height: 320px;
            margin: 0;
            padding: 0;
            background: var(--nord0);
            color: var(--nord4);
            font-family: Arial, Helvetica, sans-serif;
            overflow-y: auto;
            -webkit-text-size-adjust: none;
            text-size-adjust: none;
        }
        .container {
            width: 224px;
            margin: 8px auto 0 auto;
            padding: 8px 4px 12px 4px;
            background: var(--nord0);
            border-radius: 0;
            border: 1px solid var(--nord8);
        }
        h1 {
            color: var(--nord8);
            font-size: 16px;
            margin: 0 0 8px 0;
            text-align: center;
            font-family:'Cinzel Decorative', 'UnifrakturCook', serif;
            text-shadow:0 1px 2px var(--nord3);
        }
        .iface {
            display: block;
            margin-bottom: 10px;
            padding: 10px 4px;
            background: var(--nord0);
            border-radius: 0;
            border: 1px solid var(--nord3);
            font-size: 15px;
        }
        .up { color: var(--nord14); font-weight: bold; }
        .down { color: var(--nord11); font-weight: bold; }
        .info {
            color: var(--nord8);
            font-size: 13px;
            margin-bottom: 4px;
        }
        .back {
            display: block;
            margin: 12px auto 0 auto;
            text-align: center;
            color: var(--nord8);
            background: var(--nord0);
            border-radius: 0;
            padding: 10px 0;
            width: 100%;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            border: 1px solid var(--nord8);
            transition: background .15s, color .15s, border .15s;
        }
        .back:focus, .back:hover {
            background: var(--nord8);
            color: var(--nord0);
            border: 1px solid var(--nord8);
        }
        button {
            margin-top:6px;
            padding:6px 12px;
            background: var(--nord0);
            color: var(--nord8);
            border:1px solid var(--nord8);
            border-radius:4px;
            cursor:pointer;
            font-size:13px;
            font-weight:bold;
            transition: background .15s, color .15s, border .15s;
        }
        button:focus, button:hover {
            background: var(--nord8);
            color: var(--nord0);
            border: 1px solid var(--nord8);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Interface Status</h1>
        <div id="iface-list">Loading...</div>
        <a href="success.html" class="back">&lt; DASHBOARD</a>
    </div>
    <script>
    function apiJson(method, url, cb) {
        var xhr = new XMLHttpRequest();
        xhr.open(method, url, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState !== 4) return;
            if (xhr.status < 200 || xhr.status >= 300) {
                cb(new Error('HTTP ' + xhr.status), null);
                return;
            }
            try {
                cb(null, JSON.parse(xhr.responseText));
            } catch (e) {
                cb(e, null);
            }
        };
        xhr.send(null);
    }

    function esc(s) {
        s = (s === null || s === undefined) ? '' : String(s);
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function fetchStatus() {
        apiJson('GET', '/api/interfaces/status', function(err, data) {
            if (err) {
                document.getElementById('iface-list').innerHTML = 'Error loading interfaces.';
                return;
            }
            var html = '';
            var interfaces = data && data.interfaces ? data.interfaces : null;
            if (interfaces) {
                for (var name in interfaces) {
                    if (!interfaces.hasOwnProperty(name)) continue;
                    var info = interfaces[name] || {};
                    var upText = info.up ? 'UP' : 'DOWN';
                    var modeText = info.mode ? String(info.mode).toUpperCase() : 'UNKNOWN';
                    html += "<div class='iface'><div><b>" + esc(name) + "</b></div>";
                    html += "<div class='info'>MAC: " + esc(info.mac || 'N/A') + "</div>";
                    if (info.ip) { html += "<div class='info'>IP: " + esc(info.ip) + "</div>"; }
                    if (info.ssid) { html += "<div class='info'>SSID: " + esc(info.ssid) + "</div>"; }
                    html += "<div>Status: <span class='info'>" + esc(upText) + "</span> | <span class='info'>" + esc(modeText) + "</span></div>";
                    html += "</div>";
                }
            } else {
                html = 'No interface data.';
            }
            document.getElementById('iface-list').innerHTML = html;
        });
    }

    setInterval(fetchStatus, 2000);
    fetchStatus();
    </script>
</body>
</html>
