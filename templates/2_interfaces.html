<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Interface Status</title>
<style>
*{box-sizing:border-box}
html,body{
  height:100%;
  width:100%;
  margin:0;
  padding:0;
  background:#000;
  color:#fff;
  font-family: Arial, Helvetica, sans-serif;
  overflow-y:auto;
}
body{padding:10px 8px 16px;}
a{color:#fff !important;text-decoration:none;}
a:visited{color:#fff !important;}
.h{position:relative;border-bottom:1px solid #FF00C8;padding-bottom:8px;margin-bottom:10px;}
.t{display:block;padding-right:88px;color:#fff;font-size:12px;font-weight:bold;letter-spacing:1px;}
.back{position:absolute;right:0;top:0;color:#fff;text-decoration:none;border:1px solid #FF00C8;padding:3px 6px;font-size:10px;background:transparent;}
.back:focus{background:#FF00C8;color:#000;}
.card{border:1px solid #FF00C8;background:#000;padding:10px 8px;margin-bottom:10px;}
.st{font-size:12px;font-weight:bold;margin-bottom:6px;color:#fff;}
.ok{color:#fff;}
.warn{color:#fff;}
.bad{color:#fff;}
.dim{color:#bbb;}
.btn{display:block;width:100%;margin-top:6px;padding:10px 8px;background:#000;color:#fff;border:1px solid #FF00C8;font-size:12px;font-weight:bold;cursor:pointer;}
.btn:focus,.btn:hover{background:#FF00C8;color:#000;}
.btn2{border-color:#FF69B4;color:#fff;}
.btn2:focus,.btn2:hover{background:#FF69B4;color:#000;border-color:#FF69B4;}
.btn3{border-color:#C71585;color:#fff;}
.btn3:focus,.btn3:hover{background:#C71585;color:#000;border-color:#C71585;}
.btn4{border-color:#DA70D6;color:#fff;}
.btn4:focus,.btn4:hover{background:#DA70D6;color:#000;border-color:#DA70D6;}
.log{background:#000;border:1px solid #FF00C8;color:#fff;font-size:11px;padding:8px;white-space:pre-wrap;}
</style>
</head>
<body>
<div class="h">
  <div class="t">INTERFACES</div>
  <a class="back" href="success.html">&lt; DASH</a>
</div>

<div class="card">
  <div class="st">Network Interface Status</div>
  <button class="btn" type="button" onclick="updateInterfaces()">REFRESH</button>
  <div id="result" class="log">Click "REFRESH" to check interface status...</div>
</div>

<script>
function esc(s) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(s));
  return div.innerHTML;
}

function apiJson(method, url, data, callback) {
  var xhr = new XMLHttpRequest();
  xhr.open(method, url, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        try {
          var response = JSON.parse(xhr.responseText);
          callback(null, response);
        } catch (e) {
          callback('Invalid JSON response', null);
        }
      } else {
        callback('HTTP ' + xhr.status, null);
      }
    }
  };
  xhr.onerror = function() {
    callback('Network error', null);
  };
  xhr.send(JSON.stringify(data));
}

function updateInterfaces() {
  apiJson('POST', '/api/interfaces/status', {}, function(err, data) {
    var result = document.getElementById('result');
    
    if (err) {
      result.innerHTML = '<span style="color:#ff6b6b;">Error: ' + err + '</span>';
      return;
    }
    
    if (data && data.ok) {
      var output = '';
      if (data.interfaces) {
        for (var iface in data.interfaces) {
          var info = data.interfaces[iface];
          output += 'Interface: ' + iface + '\n';
          output += '  Status: ' + (info.up ? 'UP' : 'DOWN') + '\n';
          output += '  Mode: ' + (info.mode || 'Unknown') + '\n';
          output += '  MAC: ' + (info.mac || 'N/A') + '\n';
          output += '  IP: ' + (info.ip || 'N/A') + '\n';
          output += '  SSID: ' + (info.ssid || 'N/A') + '\n';
          output += '  Channel: ' + (info.channel || 'N/A') + '\n';
          output += '  Signal: ' + (info.signal || 'N/A') + '\n\n';
        }
      } else {
        output = 'No interface data available';
      }
      result.innerHTML = esc(output);
    } else {
      result.innerHTML = '<span style="color:#ff6b6b;">Error: ' + ((data && data.error) ? data.error : 'Unknown') + '</span>';
    }
  });
}

// Auto-refresh every 10 seconds
setInterval(updateInterfaces, 10000);
</script>
</body>
</html>
