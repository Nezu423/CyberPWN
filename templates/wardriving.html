<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wardriving</title>
<style>
*{box-sizing:border-box}
html,body{
  height:100%;
  width:100%;
  margin:0;
  padding:0;
  background:#000;
  color:#fff;
  font-family: Arial, Helvetica, sans-serif;
  overflow-y:auto;
}
body{padding:10px 8px 16px;}
a{color:#fff !important;text-decoration:none;}
a:visited{color:#fff !important;}
.h{position:relative;border-bottom:1px solid #FF00C8;padding-bottom:8px;margin-bottom:10px;}
.t{display:block;padding-right:88px;color:#fff;font-size:12px;font-weight:bold;letter-spacing:1px;}
.back{position:absolute;right:0;top:0;color:#fff;text-decoration:none;border:1px solid #FF00C8;padding:3px 6px;font-size:10px;background:transparent;}
.back:focus{background:#FF00C8;color:#000;}
.card{border:1px solid #FF00C8;background:#000;padding:10px 8px;margin-bottom:10px;}
.st{font-size:12px;font-weight:bold;margin-bottom:6px;color:#fff;}
.ok{color:#fff;}
.warn{color:#fff;}
.bad{color:#fff;}
.dim{color:#bbb;}
.btn{display:block;width:100%;margin-top:6px;padding:10px 8px;background:#000;color:#fff;border:1px solid #FF00C8;font-size:12px;font-weight:bold;cursor:pointer;}
.btn:focus,.btn:hover{background:#FF00C8;color:#000;}
.btn2{border-color:#FF69B4;color:#fff;}
.btn2:focus,.btn2:hover{background:#FF69B4;color:#000;border-color:#FF69B4;}
.btn3{border-color:#C71585;color:#fff;}
.btn3:focus,.btn3:hover{background:#C71585;color:#000;border-color:#C71585;}
.btn4{border-color:#DA70D6;color:#fff;}
.btn4:focus,.btn4:hover{background:#DA70D6;color:#000;border-color:#DA70D6;}
.log{background:#000;border:1px solid #FF00C8;color:#fff;font-size:11px;padding:8px;white-space:pre-wrap;}
</style>
</head>
<body>
<div class="h">
  <div class="t">WARDRIVING</div>
  <a class="back" href="/success">&lt; DASH</a>
</div>

<div class="card">
  <div class="st">WiFi Scanner</div>
  <button id="toggleBtn" class="btn" type="button" onclick="toggleWardriving()">Start Wardriving</button>
  <div id="result" class="log">Click "Start Wardriving" to begin scanning...</div>
</div>

<script>
function esc(s) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(s));
  return div.innerHTML;
}

function apiJson(method, url, data, callback) {
  var xhr = new XMLHttpRequest();
  xhr.open(method, url, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        try {
          var response = JSON.parse(xhr.responseText);
          callback(null, response);
        } catch (e) {
          callback('Invalid JSON response', null);
        }
      } else {
        callback('HTTP ' + xhr.status, null);
      }
    }
  };
  xhr.onerror = function() {
    callback('Network error', null);
  };
  xhr.send(JSON.stringify(data));
}

var isRunning = false;
var wardrivingInterval = null;

function toggleWardriving() {
  var btn = document.getElementById('toggleBtn');
  var result = document.getElementById('result');
  
  if (isRunning) {
    // Stop wardriving
    if (wardrivingInterval) {
      clearInterval(wardrivingInterval);
      wardrivingInterval = null;
    }
    isRunning = false;
    btn.textContent = 'Start Wardriving';
    result.innerHTML = 'Wardriving stopped.';
  } else {
    // Start wardriving
    isRunning = true;
    btn.textContent = 'Stop Wardriving';
    result.innerHTML = 'Authenticating...';
    
    // Authenticate with API first
    apiJson('POST', '/api/verify_pin', {pin: '062823'}, function(err, data) {
      if (err || !data.ok) {
        result.innerHTML = '<span style="color:#ff6b6b;">Authentication failed. Please check PIN.</span>';
        isRunning = false;
        btn.textContent = 'Start Wardriving';
        return;
      }
      
      // Reset log for new session
      apiJson('POST', '/api/wardriving/reset', function(err, data) {
        // Don't care about response, just reset the log
      });
      
      // Get initial scan
      updateWardriving();
      
      // Set up interval for continuous scanning
      wardrivingInterval = setInterval(updateWardriving, 10000);
    });
  }
}

function updateWardriving() {
  apiJson('POST', '/api/wardriving/raw', function(err, data) {
    var result = document.getElementById('result');
    if (err) {
      result.innerHTML = '<span style="color:#ff6b6b;">Error: ' + err + '</span>';
      return;
    }
    
    if (data && data.ok) {
      var timestamp = new Date().toLocaleString();
      var output = '=== Wardriving Scan - ' + timestamp + ' ===\n\n';
      output += data.raw_output || 'No output';
      result.innerHTML = esc(output);
    } else {
      result.innerHTML = '<span style="color:#ff6b6b;">Error: ' + ((data && data.error) ? data.error : 'Unknown') + '</span>';
    }
  });
}
</script>
</body>
</html>
