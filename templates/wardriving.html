<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wardriving - CyberPWN</title>
<style>
:root {
  --bg: #000;
  --fg: #fff;
  --accent: #FF00C8;
  --border: #FF69B4;
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Courier New', monospace;
  margin: 0;
  padding: 2rem;
}
.header {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 2rem;
}
.dash {
  color: var(--accent);
  text-decoration: none;
  border: 1px solid var(--border);
  padding: 0.3rem 0.8rem;
  font-size: 0.9rem;
}
.dash:hover {
  background: var(--accent);
  color: var(--bg);
}
h1 {
  color: var(--accent);
  text-shadow: 0 0 10px var(--accent);
  margin-bottom: 1rem;
}
button {
  background: var(--accent);
  color: var(--bg);
  border: none;
  padding: 0.5rem 1rem;
  font-family: inherit;
  cursor: pointer;
  margin: 0.5rem;
  transition: all 0.3s;
}
button:hover {
  box-shadow: 0 0 10px var(--accent);
}
#result {
  margin-top: 1rem;
  white-space: pre-wrap;
  font-family: monospace;
  font-size: 0.9rem;
  color: #00ff00;
  background: #111;
  padding: 1rem;
  border: 1px solid var(--border);
  border-radius: 4px;
}
</style>
</head>
<body>
<div class="header">
<a href="/success" class="dash">&lt; DASH</a>
</div>
<h1>Wardriving</h1>
<button id="toggleBtn" onclick="toggleWardriving()">Start Wardriving</button>
<div id="result">Click Start to begin wardriving.</div>
<script>
function esc(str) {
  return String(str).replace(/[&<>"']/g, function(s) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s];
  });
}

function apiJson(method, url, cb) {
  var xhr = new XMLHttpRequest();
  xhr.open(method, url, true);
  xhr.onload = function() {
    if (xhr.status === 200) {
      try { cb(null, JSON.parse(xhr.responseText)); }
      catch(e) { cb(e, null); }
    } else {
      cb(new Error('HTTP ' + xhr.status), null);
    }
  };
  xhr.onerror = function() { cb(new Error('Network error'), null); };
  xhr.send();
}

var wardrivingInterval = null;
var isRunning = false;

function toggleWardriving() {
  var btn = document.getElementById('toggleBtn');
  var result = document.getElementById('result');
  
  if (isRunning) {
    // Stop wardriving
    if (wardrivingInterval) {
      clearInterval(wardrivingInterval);
      wardrivingInterval = null;
    }
    isRunning = false;
    btn.textContent = 'Start Wardriving';
    result.innerHTML = 'Wardriving stopped.';
  } else {
    // Start wardriving
    isRunning = true;
    btn.textContent = 'Stop Wardriving';
    result.innerHTML = 'Starting wardriving...';
    
    // Reset log for new session
    apiJson('POST', '/api/wardriving/reset', function(err, data) {
      // Don't care about response, just reset the log
    });
    
    // Get initial scan
    updateWardriving();
    
    // Set up interval for continuous scanning
    wardrivingInterval = setInterval(updateWardriving, 10000);
  }
}

function updateWardriving() {
  apiJson('POST', '/api/wardriving/raw', function(err, data) {
    var result = document.getElementById('result');
    if (err) {
      result.innerHTML = '<span style="color:#ff6b6b;">Error: ' + err + '</span>';
      return;
    }
    
    if (data && data.ok) {
      var timestamp = new Date().toLocaleString();
      var output = '=== Wardriving Scan - ' + timestamp + ' ===\n\n';
      output += data.raw_output || 'No output';
      result.innerHTML = esc(output);
    } else {
      result.innerHTML = '<span style="color:#ff6b6b;">Error: ' + ((data && data.error) ? data.error : 'Unknown') + '</span>';
    }
  });
}
</script>
</body>
</html>
