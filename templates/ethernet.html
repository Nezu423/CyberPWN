<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CyberPWN — ETHERNET PAYLOADS</title>
<script>if(!sessionStorage.getItem("_k")){window.location.href="/";}</script>
<style>
*{box-sizing:border-box}
html,body{
    height:100%;
    margin:0;
    padding:0;
    background:#000 url('https://i.imgur.com/0v1CGpT.png') center 40px no-repeat;
    background-size:120px 120px;
    color:#fff;
    font-family:'Montserrat', 'Segoe UI', 'Arial', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    overflow-y:auto;
}
body{padding:20px 10px 30px;}
.head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #fff;padding-bottom:10px;margin-bottom:14px;}
.t1{color:#fff;font-size:14px;font-weight:bold;}
.back{color:#fff;text-decoration:none;border:1px solid #fff;padding:5px 10px;font-size:11px;background:transparent;}
.back:focus{background:#fff;color:#000;}
.acc-btn{width:100%;background:#000;color:#fff;border:1px solid #fff;padding:14px;text-align:left;font-size:14px;font-weight:bold;margin-top:10px;cursor:pointer;transition:background .15s, color .15s;}
.acc-btn:focus{background:#fff;color:#000;outline:none;}
.action-btn{width:100%;padding:12px;background:#111;color:#fff;border:1px solid #fff;margin-top:8px;font-weight:bold;cursor:pointer;transition:background .15s, color .15s;}
.action-btn:focus{background:#fff;color:#000;}
.panel{display:none;background:#111;border:1px solid #fff;padding:12px;}
.log-box{width:100%;height:160px;background:#000;border:1px solid #fff;color:#fff;font-size:12px;padding:8px;overflow-y:scroll;white-space:pre-wrap;margin-top:8px;line-height:1.5;}
.log-box:focus{border:1px solid #fff;outline:none;}
.hint{font-size:10px;color:#fff;margin-top:6px;}
</style>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</style>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
</style>
</head>
<body>
<div class="head">
    <span class="t1">ETHERNET PAYLOADS</span>
    <a href="success.html" class="back">&lt; DASHBOARD</a>
</div>

<button class="acc-btn" onclick="openP('p1')">&gt; CISCO VLAN DISCOVERY</button>
<div id="p1" class="panel">
    <div class="hint">SNMP/CDP — discover VLANs on target (requires IP).</div>
    <button class="action-btn" onclick="req('/api/cisco_vlans','vlan-log')">SCAN VLANs</button>
    <div id="vlan-log" class="log-box" tabindex="0">READY</div>
</div>

<button class="acc-btn" onclick="openP('p2')">&gt; CISCO AUDIT (known vulns)</button>
<div id="p2" class="panel">
    <div class="hint">Check Cisco ports (23 Telnet, 161 SNMP, 443 Web) and known CVE hints.</div>
    <button class="action-btn" onclick="req('/api/cisco_audit','audit-log')">RUN AUDIT</button>
    <div id="audit-log" class="log-box" tabindex="0">READY</div>
</div>

<script>
function openP(id){
    var p=document.getElementById(id);
    var cur=p.style.display;
    var all=document.getElementsByClassName("panel");
    for(var i=0;i<all.length;i++) all[i].style.display="none";
    if(cur!=="block") p.style.display="block";
}
function req(endpoint,logId){
    var log=document.getElementById(logId);
    log.innerHTML="Loading...";
    var x=new XMLHttpRequest();
    x.open("GET",endpoint,true);
    x.timeout=30000;
    x.onreadystatechange=function(){
        if(x.readyState!==4)return;
        if(x.status===200){
            try{
                var d=JSON.parse(x.responseText);
                if(Array.isArray(d)){log.innerHTML="";for(var i=0;i<d.length;i++)log.innerHTML+=d[i]+"\n";}
                else log.innerHTML=d.log||d.msg||d.status||JSON.stringify(d);
                log.focus();
            }catch(e){log.innerHTML="DATA ERROR";}
        }else log.innerHTML="ERROR: "+x.status;
    };
    x.ontimeout=function(){log.innerHTML="TIMEOUT";};
    x.send();
}
</script>
</body>
</html>
