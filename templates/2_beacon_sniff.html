<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Beacon Sniff Results</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
  .dash{color:var(--nord8) !important;text-decoration:none;border:1px solid var(--nord8);padding:3px 6px;font-size:10px;background:transparent;display:inline-block;}

    :root {
      --nord0: #000000;
      --nord1: #000000;
      --nord2: #000000;
      --nord3: #202020;
      --nord4: #EAEAEA;
      --nord5: #EAEAEA;
      --nord6: #EAEAEA;
      --nord7: #00FFE7;
      --nord8: #00FFE7;
      --nord9: #FF00C8;
      --nord10: #00FFE7;
      --nord11: #FF3C00;
      --nord12: #FFD600;
      --nord13: #FFD600;
      --nord14: #00FF5A;
      --nord15: #FF00C8;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
    }
    a{color:#FFD600 !important;text-decoration:none;}
    a:visited{color:#FFD600 !important;}
    body {
      background: #000;
      background: var(--nord0);
      color: #fff;
      color: var(--nord4);
      font-family: 'Montserrat', Arial, Helvetica, sans-serif;
      padding: 10px;
      font-size: 11px;
    }
    h2{margin:0 0 8px 0;font-size:12px;color:#00FFE7;}
    .result {
      background: #000;
      background: var(--nord0);
      border: 1px solid #00FFE7;
      border: 1px solid var(--nord8);
      padding: 8px;
      border-radius: 0;
      word-break: break-all;
      font-size: 10px;
      line-height: 1.25;
    }
    .btn {
      margin-top: 12px;
      padding: 8px 16px;
      background: #000;
      background: var(--nord0);
      color: #00FFE7;
      color: var(--nord8);
      border: 1px solid #00FFE7;
      border: 1px solid var(--nord8);
      border-radius: 0;
      font-weight: bold;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .btn:hover {
      background: #00FFE7;
      background: var(--nord8);
      color: #000;
      color: var(--nord0);
    }
</style>
</head>
<body>

<div style="text-align:right;margin-bottom:6px;"><a class="dash" href="success.html">&lt;DASH</a></div>

<h2>Beacon Sniff Results</h2>
<div class="result" id="result">Loading...</div>
<script>
function esc(str) {
  return String(str).replace(/[&<>"']/g, function(s) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s];
  });
}

function apiJson(method, url, cb) {
  var xhr = new XMLHttpRequest();
  xhr.open(method, url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status < 200 || xhr.status >= 300) {
      cb(new Error('HTTP ' + xhr.status), null);
      return;
    }
    try {
      cb(null, JSON.parse(xhr.responseText));
    } catch (e) {
      cb(e, null);
    }
  };
  xhr.send(null);
}

function updateBeacon() {
  apiJson('POST', '/api/sniffer/beacon', function(err, data) {
    var html = '';
    if (err) {
      html = '<span style="color:#BF616A;">Error: ' + err + '</span>';
      document.getElementById('result').innerHTML = html;
      return;
    }
    if (data && data.ok) {
      var aps = data.aps || [];
      
      // Check for open networks
      var openNetworks = [];
      var i;
      for (i = 0; i < aps.length; i++) {
        var a = aps[i] || {};
        var ssid = (a.ssid === null || a.ssid === undefined) ? '' : String(a.ssid);
        // Check if network is open (no security or contains "Open")
        if (ssid.toLowerCase().indexOf('open') !== -1 || ssid.toLowerCase().indexOf('--') !== -1) {
          openNetworks.push(ssid);
        }
      }
      
      // Show alert for open networks
      if (openNetworks.length > 0) {
        html += '<div style="background:#8B0000;border:1px solid #FF0000;padding:8px;margin-bottom:10px;border-radius:4px;">';
        html += '<div style="color:#FF6B6B;font-weight:bold;">⚠ OPEN NETWORKS DETECTED:</div>';
        html += '<div style="color:#FFA07A;font-size:0.9em;">' + esc(openNetworks.join(', ')) + '</div>';
        html += '</div>';
      }
      
      html += '<b>APs Found: ' + (data.count || aps.length) + '</b><br>';
      html += '<div style="margin-top:6px;font-family:monospace;">';
      if (!aps.length) {
        html += '<span style="color:#FFD600;">No AP details.</span>';
        if (data && data.diag && data.diag.sample) {
          html += '<div style="margin-top:6px;color:#bbb;font-size:9px;">Raw sample:</div>';
          html += '<div style="color:#888;font-size:9px;white-space:pre-wrap;">' + esc(data.diag.sample.join('\n')) + '</div>';
        }
      } else {
        var i;
        for (i = 0; i < aps.length; i++) {
          var a = aps[i] || {};
          var ssid = (a.ssid === null || a.ssid === undefined) ? '' : String(a.ssid);
          var signal = (a.signal === null || a.signal === undefined) ? 'N/A' : (String(a.signal) + '%');
          var rssi = (a.rssi === null || a.rssi === undefined) ? 'N/A' : (String(a.rssi) + 'dBm');
          html += '<div style="margin:0.2rem 0;">';
          html += '<div style="color:#FFD600;">' + esc(ssid) + '</div>';
          html += '<div style="color:#888;font-size:0.9em;">Signal: ' + signal + ' (' + rssi + ')</div>';
          html += '</div>';
        }
      }
      html += '</div>';
    } else {
      html = '<span style="color:#BF616A;">Error: ' + ((data && data.error) ? data.error : 'Unknown') + '</span>';
      if (data && data.stdout) {
        html += '<div style="margin-top:6px;color:#bbb;white-space:pre-wrap;">STDOUT:\n' + String(data.stdout).substring(0, 600) + '</div>';
      }
      if (data && data.stderr) {
        html += '<div style="margin-top:6px;color:#bbb;white-space:pre-wrap;">STDERR:\n' + String(data.stderr).substring(0, 600) + '</div>';
      }
    }
    document.getElementById('result').innerHTML = html;
  });
}
setInterval(updateBeacon, 2000);
updateBeacon();
</script>
</body>
</html>
