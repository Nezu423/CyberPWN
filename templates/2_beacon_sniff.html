<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Beacon Sniff Results</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
  .dash{color:var(--nord8) !important;text-decoration:none;border:1px solid var(--nord8);padding:3px 6px;font-size:10px;background:transparent;display:inline-block;}

    :root {
      --nord0: #000000;
      --nord1: #000000;
      --nord2: #000000;
      --nord3: #FF00C8;
      --nord4: #FFFFFF;
      --nord5: #FFFFFF;
      --nord6: #FFFFFF;
      --nord7: #FF00C8;
      --nord8: #FF00C8;
      --nord9: #FF69B4;
      --nord10: #DA70D6;
      --nord11: #C71585;
      --nord12: #FF69B4;
      --nord13: #FF69B4;
      --nord14: #FFFFFF;
      --nord15: #FF00C8;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
    }
    a{color:#fff !important;text-decoration:none;}
    a:visited{color:#fff !important;}
    body {
      background: #000;
      background: var(--nord0);
      color: #fff;
      color: var(--nord4);
      font-family: 'Montserrat', Arial, Helvetica, sans-serif;
      padding: 10px;
      font-size: 11px;
    }
    h2{margin:0 0 8px 0;font-size:12px;color:var(--nord8);}
    .result {
      background: #000;
      background: var(--nord0);
      border: 1px solid #00FFE7;
      border: 1px solid var(--nord8);
      padding: 8px;
      border-radius: 0;
      word-break: break-all;
      font-size: 10px;
      line-height: 1.25;
    }
    .btn {
      margin-top: 12px;
      padding: 8px 16px;
      background: #000;
      background: var(--nord0);
      color: #00FFE7;
      color: var(--nord8);
      border: 1px solid #00FFE7;
      border: 1px solid var(--nord8);
      border-radius: 0;
      font-weight: bold;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .btn:hover {
      background: #00FFE7;
      background: var(--nord8);
      color: #000;
      color: var(--nord0);
    }
</style>
</head>
<body>

<div style="text-align:right;margin-bottom:6px;"><a class="dash" href="success.html">&lt;DASH</a></div>

<h2>Beacon Sniff Results</h2>
<div class="result" id="result">Loading...</div>
<script>
function apiJson(method, url, cb) {
  var xhr = new XMLHttpRequest();
  xhr.open(method, url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status < 200 || xhr.status >= 300) {
      cb(new Error('HTTP ' + xhr.status), null);
      return;
    }
    try {
      cb(null, JSON.parse(xhr.responseText));
    } catch (e) {
      cb(e, null);
    }
  };
  xhr.send(null);
}

function updateBeacon() {
  apiJson('POST', '/api/sniffer/beacon', function(err, data) {
    var html = '';
    if (err) {
      html = '<span style="color:#BF616A;">Error: ' + err + '</span>';
      document.getElementById('result').innerHTML = html;
      return;
    }
    if (data && data.ok) {
      var aps = data.aps || [];
      html += '<b>APs Found: ' + (data.count || aps.length) + '</b><br>';
      html += '<div style="margin-top:6px;font-family:monospace;">';
      if (!aps.length) {
        html += '<span style="color:#FFD600;">No AP details.</span>';
      } else {
        html += '<div style="color:#FFD600;font-weight:bold;">SSID               | RSSI    | SECURITY</div>';
        var i;
        for (i = 0; i < aps.length; i++) {
          var a = aps[i] || {};
          var ssid = (a.ssid === null || a.ssid === undefined) ? '' : String(a.ssid);
          if (!ssid) ssid = '<hidden>';
          var rssi = (a.rssi === null || a.rssi === undefined) ? 'N/A' : (String(a.rssi) + 'dBm');
          var sec = (a.security === null || a.security === undefined) ? '' : String(a.security);
          if (sec.length > 18) sec = sec.substring(0, 18);
          if (ssid.length > 18) ssid = ssid.substring(0, 18);
          while (ssid.length < 18) ssid += ' ';
          while (rssi.length < 7) rssi = ' ' + rssi;
          while (sec.length < 18) sec += ' ';
          html += '<div>' + ssid + ' | ' + rssi + ' | ' + sec + '</div>';
        }
      }
      html += '</div>';
    } else {
      html = '<span style="color:#BF616A;">Error: ' + ((data && data.error) ? data.error : 'Unknown') + '</span>';
      if (data && data.stdout) {
        html += '<div style="margin-top:6px;color:#bbb;white-space:pre-wrap;">STDOUT:\n' + String(data.stdout).substring(0, 600) + '</div>';
      }
      if (data && data.stderr) {
        html += '<div style="margin-top:6px;color:#bbb;white-space:pre-wrap;">STDERR:\n' + String(data.stderr).substring(0, 600) + '</div>';
      }
    }
    document.getElementById('result').innerHTML = html;
  });
}
setInterval(updateBeacon, 2000);
updateBeacon();
</script>
</body>
</html>
