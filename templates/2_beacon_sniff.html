<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Beacon Sniff Results</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
      --nord0: #000000;
      --nord1: #000000;
      --nord2: #000000;
      --nord3: #202020;
      --nord4: #EAEAEA;
      --nord5: #EAEAEA;
      --nord6: #EAEAEA;
      --nord7: #00FFE7;
      --nord8: #00FFE7;
      --nord9: #FF00C8;
      --nord10: #00FFE7;
      --nord11: #FF3C00;
      --nord12: #FFD600;
      --nord13: #FFD600;
      --nord14: #00FF5A;
      --nord15: #FF00C8;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
    }
    a{color:#FFD600 !important;text-decoration:none;}
    a:visited{color:#FFD600 !important;}
    body {
      background: #000;
      background: var(--nord0);
      color: #fff;
      color: var(--nord4);
      font-family: 'Montserrat', Arial, Helvetica, sans-serif;
      padding: 10px;
      font-size: 11px;
    }
    h2{margin:0 0 8px 0;font-size:12px;color:#00FFE7;}
    .result {
      background: #000;
      background: var(--nord0);
      border: 1px solid #00FFE7;
      border: 1px solid var(--nord8);
      padding: 8px;
      border-radius: 0;
      word-break: break-all;
      font-size: 10px;
      line-height: 1.25;
    }
    .btn {
      margin-top: 12px;
      padding: 8px 16px;
      background: #000;
      background: var(--nord0);
      color: #00FFE7;
      color: var(--nord8);
      border: 1px solid #00FFE7;
      border: 1px solid var(--nord8);
      border-radius: 0;
      font-weight: bold;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .btn:hover {
      background: #00FFE7;
      background: var(--nord8);
      color: #000;
      color: var(--nord0);
    }
</style>
</head>
<body>
<h2>Beacon Sniff Results</h2>
<div class="result" id="result">Loading...</div>
<button class="btn" onclick="location.href='success.html'">Back to Dashboard</button>
<script>
function apiJson(method, url, cb) {
  var xhr = new XMLHttpRequest();
  xhr.open(method, url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status < 200 || xhr.status >= 300) {
      cb(new Error('HTTP ' + xhr.status), null);
      return;
    }
    try {
      cb(null, JSON.parse(xhr.responseText));
    } catch (e) {
      cb(e, null);
    }
  };
  xhr.send(null);
}

function updateBeacon() {
  apiJson('POST', '/api/sniffer/beacon', function(err, data) {
    var html = '';
    if (err) {
      html = '<span style="color:#BF616A;">Error: ' + err + '</span>';
      document.getElementById('result').innerHTML = html;
      return;
    }
    if (data && data.ok) {
      var aps = data.aps || [];
      html += '<b>APs Found: ' + (data.count || aps.length) + '</b><br>';
      html += '<div style="margin-top:6px;">';
      if (!aps.length) {
        html += '<span style="color:#FFD600;">No AP details.</span>';
      } else {
        html += '<div style="color:#FFD600;font-weight:bold;">SSID | BSSID | RSSI | SIG | CH | SEC</div>';
        var i;
        for (i = 0; i < aps.length; i++) {
          var a = aps[i] || {};
          var ssid = (a.ssid === null || a.ssid === undefined) ? '' : String(a.ssid);
          if (!ssid) ssid = '<hidden>';
          var bssid = (a.bssid === null || a.bssid === undefined) ? '' : String(a.bssid);
          var rssi = (a.rssi === null || a.rssi === undefined) ? 'N/A' : (String(a.rssi) + 'dBm');
          var sig = (a.signal === null || a.signal === undefined) ? 'N/A' : (String(a.signal) + '%');
          var ch = (a.channel === null || a.channel === undefined) ? '' : String(a.channel);
          var sec = (a.security === null || a.security === undefined) ? '' : String(a.security);
          if (sec.length > 18) sec = sec.substring(0, 18);
          if (ssid.length > 14) ssid = ssid.substring(0, 14);
          html += '<div>' + ssid + ' | ' + bssid + ' | ' + rssi + ' | ' + sig + ' | ' + ch + ' | ' + sec + '</div>';
        }
      }
      html += '</div>';
    } else {
      html = '<span style="color:#BF616A;">Error: ' + ((data && data.error) ? data.error : 'Unknown') + '</span>';
    }
    document.getElementById('result').innerHTML = html;
  });
}
setInterval(updateBeacon, 2000);
updateBeacon();
</script>
</body>
</html>
