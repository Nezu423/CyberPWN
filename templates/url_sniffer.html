<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>URL Sniffer</title>
<style>
*{box-sizing:border-box}
html,body{
  height:100%;
  width:100%;
  margin:0;
  padding:0;
  background:#000;
  color:#fff;
  font-family: Arial, Helvetica, sans-serif;
  overflow-y:auto;
}
body{padding:10px 8px 16px;}
a{color:#fff !important;text-decoration:none;}
a:visited{color:#fff !important;}
.h{position:relative;border-bottom:1px solid #FF00C8;padding-bottom:8px;margin-bottom:10px;}
.t{display:block;padding-right:88px;color:#fff;font-size:12px;font-weight:bold;letter-spacing:1px;}
.back{position:absolute;right:0;top:0;color:#fff;text-decoration:none;border:1px solid #FF00C8;padding:3px 6px;font-size:10px;background:transparent;}
.back:focus{background:#FF00C8;color:#000;}
.card{border:1px solid #FF00C8;background:#000;padding:10px 8px;margin-bottom:10px;}
.st{font-size:12px;font-weight:bold;margin-bottom:6px;color:#fff;}
.ok{color:#fff;}
.warn{color:#fff;}
.bad{color:#fff;}
.dim{color:#bbb;}
.btn{display:block;width:100%;margin-top:6px;padding:10px 8px;background:#000;color:#fff;border:1px solid #FF00C8;font-size:12px;font-weight:bold;cursor:pointer;}
.btn:focus,.btn:hover{background:#FF00C8;color:#000;}
.btn2{border-color:#FF69B4;color:#fff;}
.btn2:focus,.btn2:hover{background:#FF69B4;color:#000;border-color:#FF69B4;}
.btn3{border-color:#C71585;color:#fff;}
.btn3:focus,.btn3:hover{background:#C71585;color:#000;border-color:#C71585;}
.btn4{border-color:#DA70D6;color:#fff;}
.btn4:focus,.btn4:hover{background:#DA70D6;color:#000;border-color:#DA70D6;}
.log{background:#000;border:1px solid #FF00C8;color:#fff;font-size:11px;padding:8px;white-space:pre-wrap;}
.lbl{font-size:11px;color:#fff;margin:6px 0 2px 0;}
.in{width:100%;padding:6px;background:#000;color:#fff;border:1px solid #FF00C8;font-size:11px;outline:none;}
.in:focus{border-color:#FF69B4;}
.found{color:#00ff5a;}
.notfound{color:#ff3c00;}
</style>
</head>
<body>
<div class="h">
  <div class="t">URL SNIFFER</div>
  <a class="back" href="success.html">&lt; DASH</a>
</div>

<div class="card">
  <div class="st">Path Scanner</div>
  <div class="lbl">Base URL (LAN only):</div>
  <input id="u" class="in" type="text" value="http://192.168.1.1" />
  <button class="btn" type="button" onclick="scan()">SCAN PATHS</button>
  <div id="log" class="log">Ready.</div>
</div>

<script>
function _e(s){return (s===null||s===undefined)?'':String(s);}
function setLog(t){document.getElementById('log').innerHTML=t;}
function scan(){
  var url=document.getElementById('u').value;
  if(!url){setLog('Error: URL required');return;}
  setLog('Scanning '+url+'...');
  var x=new XMLHttpRequest();
  x.open('POST','/api/url_sniffer/scan',true);
  x.setRequestHeader('Content-Type','application/json');
  x.timeout=15000;
  x.onreadystatechange=function(){
    if(x.readyState!==4)return;
    if(x.status<200||x.status>=300){
      var msg='HTTP '+x.status;
      try{var d=JSON.parse(x.responseText);if(d&&d.error)msg=d.error;}catch(e){}
      setLog('Error: '+msg);
      return;
    }
    try{
      var d=JSON.parse(x.responseText);
      if(!d||!d.ok){setLog('Error: '+_e(d&&d.error));return;}
      var out='Base: '+_e(d.base)+'\n';
      out+='Resolved: '+_e(d.resolved?d.resolved.join(', '):'N/A')+'\n\n';
      out+='Checked: '+_e(d.checked)+' paths\n';
      out+='Found: '+_e(d.found)+' paths\n\n';
      var f=d.found||[];
      for(var i=0;i<f.length;i++){
        var p=f[i];
        var cls='notfound';
        if(p.found)cls='found';
        out+=p.path+' ('+p.url+') - <span class="'+cls+'">'+(p.found?'FOUND':'NOT FOUND')+'</span>\n';
        if(p.location)out+='  -> Location: '+p.location+'\n';
      }
      setLog(out);
    }catch(e){setLog('Error: '+e.message);}
  };
  x.ontimeout=function(){setLog('Error: TIMEOUT');};
  x.onerror=function(){setLog('Error: NETWORK ERROR');};
  x.send(JSON.stringify({base:url}));
}
</script>
</body>
</html>
