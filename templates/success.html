<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240, height=320, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CyberPWN — DASHBOARD</title>
<!-- System fonts only for compatibility -->
<style>
  :root {
    --nord0: #2E3440;
    --nord1: #3B4252;
    --nord2: #434C5E;
    --nord3: #4C566A;
    --nord4: #D8DEE9;
    --nord5: #E5E9F0;
    --nord6: #ECEFF4;
    --nord7: #8FBCBB;
    --nord8: #88C0D0;
    --nord9: #81A1C1;
    --nord10: #5E81AC;
    --nord11: #BF616A;
    --nord12: #D08770;
    --nord13: #EBCB8B;
    --nord14: #A3BE8C;
    --nord15: #B48EAD;
  }
  *{box-sizing:border-box}
  html,body{
    height:320px;
    width:240px;
    margin:0;
    padding:0;
    background:var(--nord0);
    color:var(--nord4);
    font-family: Arial, Helvetica, sans-serif;
    overflow-y:auto;
  }
  body{padding:8px 4px 16px;}
  .brand{
    color:var(--nord8);
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:4px;
    font-family:'Cinzel Decorative', 'UnifrakturCook', serif;
    text-shadow:0 1px 2px var(--nord3);
  }
  .tabs{
    display:flex;
    gap:4px;
    margin-bottom:10px;
  }
  .tab-btn{
    flex:1;
    padding:6px 0;
    background:var(--nord2);
    color:var(--nord4);
    border:1px solid var(--nord3);
    font-weight:bold;
    cursor:pointer;
    font-size:11px;
    border-radius:4px;
    transition:background .15s, color .15s, border .15s;
  }
  .tab-btn.active{
    background:var(--nord8);
    color:var(--nord0);
    border:1px solid var(--nord8);
  }
  .sections{margin-bottom:10px;}
  .section-title{
    font-size:12px;
    font-weight:bold;
    color:var(--nord7);
    margin:10px 0 4px 0;
    letter-spacing:1px;
    text-shadow:0 1px 2px var(--nord1);
  }
  .menu-list{list-style:none;padding:0;margin:0;}
  .menu-list li{margin-bottom:4px;}
  .menu-btn{
    display:block;
    width:100%;
    background:var(--nord1);
    color:var(--nord13);
    border:1px solid var(--nord3);
    padding:6px 8px;
    font-size:10px;
    font-weight:bold;
    border-radius:4px;
    cursor:pointer;
    transition:background .15s, color .15s, border .15s;
    text-align:left;
  }
  .menu-btn:focus,.menu-btn:hover{
    background:var(--nord8);
    color:var(--nord0);
    border:1px solid var(--nord8);
  }
  .menu-group{margin-bottom:8px;}
</style>
<script>
function showTab(tab){
  var btns = document.querySelectorAll('.tab-btn');
  var secs = document.querySelectorAll('.tab-content');
  var i;
  for (i = 0; i < btns.length; i++) {
    btns[i].classList.remove('active');
  }
  for (i = 0; i < secs.length; i++) {
    secs[i].style.display = 'none';
  }
  document.getElementById(tab+'-tab').style.display='block';
  document.getElementById(tab+'-btn').classList.add('active');
}
window.onload=function(){showTab('listener');}
</script>
</head>
<body>
<noscript>
<div style="background:#222;color:#fff;padding:10px 8px 10px 8px;font-size:13px;">
  <b>NO JAVASCRIPT DETECTED</b><br>
  <ul style="margin:10px 0 0 0;padding:0 0 0 16px;">
    <li><a href="2_beacon_sniff.html" style="color:#0cf;">Beacon Sniff</a></li>
    <li><a href="2_channel_analyzer.html" style="color:#0cf;">Channel Analyzer</a></li>
    <li><a href="2_interfaces.html" style="color:#0cf;">Interfaces</a></li>
    <li><a href="wifi.html" style="color:#0cf;">WiFi</a></li>
    <li><a href="network.html" style="color:#0cf;">Network</a></li>
  </ul>
</div>
</noscript>
<div class="brand">CYBERPWN DASHBOARD</div>
<div class="tabs">
  <button class="tab-btn" id="listener-btn" onclick="showTab('listener')">Listener</button>
</div>
<div class="sections">
  <!-- Listener Tab -->
  <div class="tab-content" id="listener-tab" style="display:block;">
    <div class="section-title">Sniffers</div>
    <div class="menu-group">
      <ul class="menu-list">
        <li><a href="2_beacon_sniff.html" class="menu-btn" data-label="Beacon Sniff">Beacon Sniff</a></li>
        <li><a href="2_channel_analyzer.html" class="menu-btn" data-label="Channel Analyzer">Channel Analyzer</a></li>
        <li><a href="2_interfaces.html" class="menu-btn" data-label="Interfaces">Interfaces</a></li>
        <li><a href="wifi.html" class="menu-btn" data-label="WiFi">WiFi</a></li>
        <li><a href="network.html" class="menu-btn" data-label="Network">Network</a></li>
      </ul>
    </div>
  </div>
</div>
</body>
</html>
