<style>

  *{box-sizing:border-box}
  html,body{
    height:320px;

    margin:0;

    color:var(--nord4);

  .brand{
    color:var(--nord8);
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:4px;
    font-family:'Cinzel Decorative', 'UnifrakturCook', serif;
    text-shadow:0 1px 2px var(--nord3);
  }
  .tabs{
    display:flex;
    gap:4px;
    margin-bottom:10px;
  }
  .tab-btn{
    flex:1;
    padding:6px 0;
    background:var(--nord2);
    color:var(--nord4);
    border:1px solid var(--nord3);
    font-weight:bold;
    cursor:pointer;
    font-size:11px;
    border-radius:4px;
    transition:background .15s, color .15s, border .15s;
  }
  .tab-btn.active{
    background:var(--nord8);
    color:var(--nord0);
    border:1px solid var(--nord8);
  }
  .sections{margin-bottom:10px;}
  .section-title{
    font-size:12px;
    font-weight:bold;
    color:var(--nord7);
    margin:10px 0 4px 0;
    letter-spacing:1px;
    text-shadow:0 1px 2px var(--nord1);
  }
  .menu-list{list-style:none;padding:0;margin:0;}
  .menu-list li{margin-bottom:4px;}
  .menu-btn{
    display:block;
    width:100%;
    background:var(--nord1);
    color:var(--nord13);
    border:1px solid var(--nord3);
    padding:6px 8px;
    font-size:10px;
    font-weight:bold;
    border-radius:4px;
    cursor:pointer;
    transition:background .15s, color .15s, border .15s;
    text-align:left;
  }
  .menu-btn:focus,.menu-btn:hover{
    background:var(--nord8);
    color:var(--nord0);
    border:1px solid var(--nord8);
  }
  .menu-group{margin-bottom:8px;}
</style>
<script>
function showTab(tab){
  var btns = document.querySelectorAll('.tab-btn');
  var secs = document.querySelectorAll('.tab-content');
  var i;
  for (i = 0; i < btns.length; i++) {
    btns[i].classList.remove('active');
  }
  for (i = 0; i < secs.length; i++) {
    secs[i].style.display = 'none';
  }
  document.getElementById(tab+'-tab').style.display='block';
  document.getElementById(tab+'-btn').classList.add('active');
}
window.onload=function(){showTab('listener');}
</script>
