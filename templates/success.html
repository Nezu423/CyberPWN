  html,body{
    height:320px;
    width:240px;
    margin:0;
    padding:0;

    color:var(--nord4);

  .brand{

  }
  .tabs{
    display:flex;
    gap:4px;
    margin-bottom:10px;
  }
  .tab-btn{
    flex:1;
    padding:6px 0;
    background:var(--nord0);
    color:var(--nord4);
    border:1px solid var(--nord8);
    font-weight:bold;
    cursor:pointer;
    font-size:11px;
    border-radius:0;
    transition:background .15s, color .15s, border .15s;
  }
  .tab-btn.active{
    background:var(--nord8);
    color:var(--nord0);
    border:1px solid var(--nord8);
  }
  .sections{margin-bottom:10px;}
  .section-title{
    font-size:12px;
    font-weight:bold;
    color:var(--nord7);
    margin:10px 0 4px 0;
    letter-spacing:1px;
    text-shadow:0 1px 2px var(--nord1);

  .menu-list{list-style:none;padding:0;margin:0;}
  .menu-list li{margin-bottom:4px;}
  .menu-btn{
    display:block;
    width:100%;
    background:var(--nord0);
    color:var(--nord13);
    border:1px solid var(--nord13);
    padding:6px 8px;
    font-size:10px;
    font-weight:bold;
    border-radius:0;
    cursor:pointer;
    transition:background .15s, color .15s, border .15s;
    text-align:left;
  }
  .menu-btn:focus,.menu-btn:hover{
    background:var(--nord8);
    color:var(--nord0);
    border:1px solid var(--nord8);
  }
  .menu-group{margin-bottom:8px;}
