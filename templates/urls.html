<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CyberPWN — URL DISCOVERY</title>
<script>if(!sessionStorage.getItem("_k")){window.location.href="/";}</script>
<style>
/* Base */
* { box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  font-family: 'Montserrat', 'Segoe UI', 'Arial', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  background: #000 url('https://i.imgur.com/0v1CGpT.png') center 40px no-repeat;
  background-size: 120px 120px;
  color: #fff;
  overflow-y: auto;
}
body { padding: 20px 12px 30px; }

.head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #222;
  padding-bottom: 12px;
  margin-bottom: 18px;
}
.t1 {
  font-size: 16px;
  font-weight: bold;
  color: #fff;
  letter-spacing: 1px;
  text-shadow: 0 0 2px #000;
}
.logo {
  width: 40px;
  height: 40px;
  background: url('https://i.imgur.com/0v1CGpT.png') no-repeat center;
  background-size: contain;
}

/* Blocks */
.block {
  background: #111;
  border: 1px solid #fff;
  padding: 14px;
  margin-bottom: 16px;
  border-radius: 6px;
}

/* Labels & Inputs */
.label {
  color: #fff;
  font-size: 11px;
  margin-bottom: 6px;
  display: block;
}
.input {
  width: 100%;
  padding: 10px;
  background: #000;
  border: 1px solid #fff;
  color: #fff;
  font-size: 13px;
  margin-bottom: 10px;
  border-radius: 4px;
  transition: border-color 0.15s, background 0.15s;
}
.input:focus {
  border-color: #fff;
  outline: none;
  background: #111;
}

/* Buttons */
.action-btn {
  width: 100%;
  padding: 12px;
  background: #111;
  color: #fff;
  border: 1px solid #fff;
  font-weight: bold;
  cursor: pointer;
  border-radius: 4px;
  transition: background 0.15s, color 0.15s;
}
.action-btn:hover, .action-btn:focus {
  background: #fff;
  color: #000;
  outline: none;
}

/* Log box */
.log-box {
  width: 100%;
  height: 220px;
  background: #000;
  border: 1px solid #fff;
  color: #fff;
  font-size: 11px;
  padding: 8px;
  overflow-y: scroll;
  white-space: pre-wrap;
  margin-top: 10px;
  line-height: 1.5;
  border-radius: 4px;
}

/* Hints */
.hint {
  font-size: 10px;
  color: #fff;
  margin-top: 6px;
}

/* Footer with Cross */
.footer {
  margin-top: 24px;
  text-align: center;
  font-size: 12px;
  color: #fff;
}
.footer .cross {
  display: inline-block;
  width: 16px;
  height: 16px;
  background: url('https://i.imgur.com/0v1CGpT.png') no-repeat center;
  background-size: contain;
  margin-left: 6px;
  vertical-align: middle;
}
/* Gengar font import */
/* Montserrat font import for readability */
</style>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">

</head>
<body>
<div class="head">
    <span class="t1">URL DISCOVERY (hidden paths)</span>
    <a href="success.html" class="back">&lt; DASHBOARD</a>
</div>

<div class="block">
    <div class="label">BASE URL (e.g. http://192.168.1.1)</div>
    <input type="text" id="baseUrl" class="input" placeholder="http://192.168.1.1" value="http://192.168.1.1">
    <div class="hint">Common wordlist: /admin, /.git, /login, /backup, etc.</div>
    <button class="action-btn" type="button" onclick="scanUrls()" style="margin-top:8px;">SCAN HIDDEN URLS</button>
    <div id="url-log" class="log-box" tabindex="0">Ready. Enter base URL and press SCAN.</div>
</div>

<script>
function scanUrls(){
    var base=document.getElementById("baseUrl").value.trim();
    if(!base){document.getElementById("url-log").innerHTML="Enter a base URL.";return;}
    var log=document.getElementById("url-log");
    log.innerHTML="Scanning...";
    var x=new XMLHttpRequest();
    x.open("POST","/api/url_scan",true);
    x.setRequestHeader("Content-Type","application/json");
    x.timeout=60000;
    x.onreadystatechange=function(){
        if(x.readyState!==4)return;
        if(x.status===200){
            try{
                var d=JSON.parse(x.responseText);
                if(d.error){log.innerHTML="ERROR: "+d.error;return;}
                var lines=(d.found||[]).map(function(r){return (r.status||r.code||"")+" "+r.url;});
                log.innerHTML=(d.base||"")+"\n"+(lines.length?lines.join("\n"):"No paths found.");
                log.focus();
            }catch(e){log.innerHTML="DATA ERROR";}
        }else log.innerHTML="ERROR: "+x.status;
    };
    x.send(JSON.stringify({base_url:base}));
}
</script>
</body>
</html>
