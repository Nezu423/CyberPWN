<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EAPOL/PMKID Scan Results</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
      --nord0: #000000;
      --nord1: #000000;
      --nord2: #000000;
      --nord3: #FF00C8;
      --nord4: #FFFFFF;
      --nord5: #FFFFFF;
      --nord6: #FFFFFF;
      --nord7: #FF00C8;
      --nord8: #FF00C8;
      --nord9: #FF69B4;
      --nord10: #DA70D6;
      --nord11: #C71585;
      --nord12: #FF69B4;
      --nord13: #FF69B4;
      --nord14: #FFFFFF;
      --nord15: #FF00C8;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
    }
    a{color:#fff !important;text-decoration:none;}
    a:visited{color:#fff !important;}
    body {
      background: #000;
      background: var(--nord0);
      color: #fff;
      color: var(--nord4);
      font-family: 'Montserrat', Arial, Helvetica, sans-serif;
      padding: 10px;
    }
    .result {
      background: #000;
      background: var(--nord0);
      border: 1px solid #00FFE7;
      border: 1px solid var(--nord8);
      padding: 8px;
      border-radius: 0;
      word-break: break-all;
    }
    .btn {
      margin-top: 12px;
      padding: 8px 16px;
      background: #000;
      background: var(--nord0);
      color: #00FFE7;
      color: var(--nord8);
      border: 1px solid #00FFE7;
      border: 1px solid var(--nord8);
      border-radius: 0;
      font-weight: bold;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .btn:hover {
      background: #00FFE7;
      background: var(--nord8);
      color: #000;
      color: var(--nord0);
    }
</style>
</head>
<body>
<h2>EAPOL/PMKID Scan Results</h2>
<div class="result" id="result">Loading...</div>
<button class="btn" onclick="location.href='success.html'">Back to Dashboard</button>
<script>
document.getElementById('result').innerHTML = '<span style="color:#BF616A;">Not supported on this device (no monitor mode)</span>';
</script>
</body>
</html>
