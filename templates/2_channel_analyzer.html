<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Channel Analyzer Results</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
      --nord0: #000000;
      --nord1: #000000;
      --nord2: #000000;
      --nord3: #FF00C8;
      --nord4: #FFFFFF;
      --nord5: #FFFFFF;
      --nord6: #FFFFFF;
      --nord7: #FF00C8;
      --nord8: #FF00C8;
      --nord9: #FF69B4;
      --nord10: #DA70D6;
      --nord11: #C71585;
      --nord12: #FF69B4;
      --nord13: #FF69B4;
      --nord14: #FFFFFF;
      --nord15: #FF00C8;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
    }
    a{color:#fff !important;text-decoration:none;}
    a:visited{color:#fff !important;}
    .dash{color:var(--nord8) !important;text-decoration:none;border:1px solid var(--nord8);padding:3px 6px;font-size:10px;background:transparent;display:inline-block;}
    body {
      background: #000;
      background: var(--nord0);
      color: #fff;
      color: var(--nord4);
      font-family: 'Montserrat', Arial, Helvetica, sans-serif;
      padding: 10px;
    }
    .result {
      background: #000;
      background: var(--nord0);
      border: 1px solid #00FFE7;
      border: 1px solid var(--nord8);
      padding: 8px;
      border-radius: 0;
      word-break: break-all;
    }
    .btn {
      margin-top: 12px;
      padding: 8px 16px;
      background: #000;
      background: var(--nord0);
      color: #00FFE7;
      color: var(--nord8);
      border: 1px solid #00FFE7;
      border: 1px solid var(--nord8);
      border-radius: 0;
      font-weight: bold;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .btn:hover {
      background: #00FFE7;
      background: var(--nord8);
      color: #000;
      color: var(--nord0);
    }
</style>
</head>
<body>
<div style="text-align:right;margin-bottom:6px;"><a class="dash" href="success.html">&lt; DASH</a></div>
<h2>Channel Analyzer Results</h2>
<div class="result" id="result">Loading...</div>
<script>
function apiJson(method, url, cb) {
  var xhr = new XMLHttpRequest();
  xhr.open(method, url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status < 200 || xhr.status >= 300) {
      cb(new Error('HTTP ' + xhr.status), null);
      return;
    }
    try {
      cb(null, JSON.parse(xhr.responseText));
    } catch (e) {
      cb(e, null);
    }
  };
  xhr.send(null);
}

function updateChannel() {
  apiJson('POST', '/api/sniffer/channel_analyzer', function(err, data) {
    var html = '';
    if (err) {
      html = '<span style="color:#BF616A;">Error: ' + err + '</span>';
      document.getElementById('result').innerHTML = html;
      return;
    }
    if (data && data.ok) {
      html += '<b>Channels:</b><ul style="padding-left:16px;">';
      var i;
      for (i = 0; i < (data.channels || []).length; i++) {
        html += '<li>' + data.channels[i] + '</li>';
      }
      html += '</ul>';
    } else {
      html = '<span style="color:#BF616A;">Error: ' + ((data && data.error) ? data.error : 'Unknown') + '</span>';
    }
    document.getElementById('result').innerHTML = html;
  });
}
setInterval(updateChannel, 2000);
updateChannel();
</script>
</body>
</html>
