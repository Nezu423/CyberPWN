<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CyberPWN — EVIL TWIN</title>
<script>if(!sessionStorage.getItem("_k")){window.location.href="/";}</script>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;background:#0d0d0d;font-family:monospace;overflow-y:auto;color:#AAA;}
#layout-table{width:100%;min-height:100%;border-collapse:collapse;}
td.center-cell{vertical-align:middle;text-align:center;padding-bottom:12px;}
.head-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.t1{color:#FCEE0A;font-size:12px;}
.back{color:#555;text-decoration:none;border:1px solid #2a2a2a;padding:2px 6px;font-size:10px;}
.back:focus{background:#FCEE0A;color:#000;}
#list{width:100%;max-height:100px;background:#0a0a0a;border:1px solid #2a2a2a;color:#0F0;font-size:11px;padding:6px;overflow-y:scroll;text-align:left;white-space:pre-wrap;margin:6px auto;}
#d{background:#000;color:#FCEE0A;font-size:18px;font-weight:bold;min-height:36px;width:220px;border:2px solid #2a2a2a;margin:0 auto 4px auto;line-height:36px;letter-spacing:2px;text-align:center;}
#s{color:#555;font-size:10px;min-height:14px;margin-bottom:6px;text-transform:uppercase;font-weight:bold;}
#hostapd-debug{display:none;width:100%;max-height:200px;background:#0a0a0a;border:1px solid #333;color:#0F0;font-size:10px;padding:8px;overflow-y:scroll;white-space:pre-wrap;text-align:left;margin:8px 0;}
#hostapd-debug.show{display:block;}
#hostapd-debug .label{color:#FCEE0A;}
.keypad{margin:0 auto;width:220px;}
.keypad td{padding:2px;width:33%;}
.b{width:100%;height:42px;background:#1a1a1a;color:#AAA;font-size:18px;border:1px solid #2a2a2a;cursor:pointer;}
.b:focus,.b:active{background:#FCEE0A;color:#000;outline:none;}
.cl{color:#555;}.en{color:#FCEE0A;}
.scan{font-size:11px;}
</style>
</head>
<body onload="_L()">
<table id="layout-table"><tr><td class="center-cell">
<div class="head-row">
    <span class="t1">EVIL TWIN</span>
    <a href="wifi.html" class="back">&lt; PAYLOADS</a>
</div>
<div style="font-size:10px;color:#666;margin-bottom:6px;">When AP is up: http://192.168.4.1:5000</div>
<button type="button" class="b scan" onclick="_scan()" style="width:100%;margin-bottom:4px;">SCAN SSIDs</button>
<div id="list">Press SCAN to load networks (1–9).</div>
<div id="d"></div>
<div id="s">SELECT 1–9</div>
<button type="button" class="b scan" onclick="_startAp()" style="width:100%;margin:4px 0;">START AP (script)</button>
<button type="button" class="b scan" onclick="_stopAp()" style="width:100%;margin:4px 0;">STOP AP</button>
<div id="hostapd-debug"></div>
<table class="keypad" border="0" cellpadding="0" cellspacing="0">
<tr><td><button class="b" type="button" onclick="_a('1')">1</button></td><td><button class="b" type="button" onclick="_a('2')">2</button></td><td><button class="b" type="button" onclick="_a('3')">3</button></td></tr>
<tr><td><button class="b" type="button" onclick="_a('4')">4</button></td><td><button class="b" type="button" onclick="_a('5')">5</button></td><td><button class="b" type="button" onclick="_a('6')">6</button></td></tr>
<tr><td><button class="b" type="button" onclick="_a('7')">7</button></td><td><button class="b" type="button" onclick="_a('8')">8</button></td><td><button class="b" type="button" onclick="_a('9')">9</button></td></tr>
<tr><td><button class="b cl" type="button" onclick="_c()">X</button></td><td><button class="b" type="button" onclick="_scan()">SCAN</button></td><td><button class="b en" type="button" onclick="_v()">OK</button></td></tr>
</table>
</td></tr></table>
<script>
var _list=[],_sel=0;
function _L(){_m("SELECT 1–9","#555");}
function _a(n){
  var i=parseInt(n,10);
  if(i<1||i>9)return;
  if(_list.length<i){_m("NO SSID","#e44");return;}
  _sel=i;_u();_m("SELECTED: "+i+" — OK to run","#FCEE0A");
}
function _c(){_sel=0;_u();_m("SELECT 1–9","#555");}
function _u(){
  var d=document.getElementById("d");
  if(_sel===0){d.innerHTML="";return;}
  if(_list[_sel-1])d.innerHTML=_sel+": "+(_list[_sel-1].ssid||"").substring(0,14);
  else d.innerHTML=_sel;
}
function _m(t,c){var s=document.getElementById("s");s.innerHTML=t;s.style.color=c;}
function _scan(){
  var listEl=document.getElementById("list");
  listEl.innerHTML="Scanning...";
  _m("SCANNING","#555");
  var x=new XMLHttpRequest();
  x.open("GET","/api/scan_wifi_list",true);
  x.onreadystatechange=function(){
    if(x.readyState!==4)return;
    if(x.status!==200){listEl.innerHTML="Error "+x.status;_m("SCAN FAIL","#e44");return;}
    try{
      _list=JSON.parse(x.responseText);
      if(!Array.isArray(_list)){_list=[];}
      var txt="";
      for(var i=0;i<_list.length&&i<9;i++)txt+=(i+1)+". "+(_list[i].ssid||"?").substring(0,16)+" "+(_list[i].signal||"")+"%\n";
      listEl.innerHTML=txt||"No networks.";
      _sel=0;_u();_m("SELECT 1–9","#555");
    }catch(e){listEl.innerHTML="Parse error";_m("ERROR","#e44");}
  };
  x.send();
}
function _v(){
  if(_sel===0){_m("SELECT 1–9","#e44");return;}
  if(!_list[_sel-1]){_m("INVALID","#e44");return;}
  var ssid=_list[_sel-1].ssid;
  _m("SENDING...","#FCEE0A");
  var x=new XMLHttpRequest();
  x.open("POST","/api/evil_twin",true);
  x.setRequestHeader("Content-Type","application/json");
  x.onreadystatechange=function(){
    if(x.readyState!==4)return;
    var logEl=document.getElementById("hostapd-debug");
    try{
      var d=JSON.parse(x.responseText);
      var cmd=d.cmd||(d.debug&&d.debug.hostapd&&d.debug.hostapd.cmd)||"(none)";
      var stdout=d.stdout||(d.debug&&d.debug.hostapd&&d.debug.hostapd.stdout)||"";
      var stderr=d.stderr||(d.debug&&d.debug.hostapd&&d.debug.hostapd.stderr)||"";
      var rc=d.returncode;
      if(d.debug&&d.debug.hostapd&&d.returncode===undefined)rc=d.debug.hostapd.returncode;
      var txt="CMD:\n"+cmd+"\n\n--- STDOUT ---\n"+(stdout||"(empty)")+"\n\n--- STDERR ---\n"+(stderr||"(empty)")+"\n\nRETURNCODE: "+(rc!==undefined?rc:"?");
      if(d.debug&&d.debug.config_preview)txt="CONFIG:\n"+d.debug.config_preview+"\n\n"+txt;
      if(rc===-1&&d.timeout)txt+="\n(Note: -1 = stopped by 8s timeout, not a crash.)";
      if(d.hint)txt+="\n\n--- HINT ---\n"+d.hint;
      logEl.textContent=txt;
      logEl.classList.add("show");
      if(d.error){_m("FAIL: "+d.error,"#e44");return;}
      _m(d.msg||"OK","#0F0");
    }catch(e){logEl.innerHTML="PARSE ERROR: "+String(e);logEl.classList.add("show");_m("ERROR","#e44");}
  };
  x.send(JSON.stringify({ssid:ssid}));
}
function _startAp(){
  if(_sel===0||!_list[_sel-1]){_m("SELECT 1–9 first","#e44");return;}
  var ssid=_list[_sel-1].ssid;
  _m("Starting AP...","#FCEE0A");
  var logEl=document.getElementById("hostapd-debug");
  logEl.textContent="Starting AP (script)...";
  logEl.classList.add("show");
  var x=new XMLHttpRequest();
  x.open("POST","/api/evil_twin_start",true);
  x.setRequestHeader("Content-Type","application/json");
  x.timeout=30000;
  x.onreadystatechange=function(){
    if(x.readyState!==4)return;
    try{
      var d=JSON.parse(x.responseText);
      var txt="CMD:\n"+(d.cmd||"")+"\n\n--- STDOUT ---\n"+(d.stdout||"(empty)")+"\n\n--- STDERR ---\n"+(d.stderr||"(empty)")+"\n\nRETURNCODE: "+(d.returncode!==undefined?d.returncode:"?");
      if(d.url)txt+="\n\nOPEN: "+d.url;
      logEl.textContent=txt;
      if(d.error){_m("FAIL: "+d.error,"#e44");return;}
      _m(d.ok?"AP up: "+d.url:"Check log","#0F0");
    }catch(e){logEl.textContent="Parse error: "+String(e);_m("ERROR","#e44");}
  };
  x.send(JSON.stringify({ssid:ssid}));
}
function _stopAp(){
  _m("Stopping AP...","#FCEE0A");
  var logEl=document.getElementById("hostapd-debug");
  logEl.textContent="Stopping AP...";
  logEl.classList.add("show");
  var x=new XMLHttpRequest();
  x.open("POST","/api/evil_twin_stop",true);
  x.setRequestHeader("Content-Type","application/json");
  x.timeout=15000;
  x.onreadystatechange=function(){
    if(x.readyState!==4)return;
    try{
      var d=JSON.parse(x.responseText);
      var txt="CMD:\n"+(d.cmd||"")+"\n\n--- STDOUT ---\n"+(d.stdout||"(empty)")+"\n\n--- STDERR ---\n"+(d.stderr||"(empty)")+"\n\nRETURNCODE: "+(d.returncode!==undefined?d.returncode:"?");
      logEl.textContent=txt;
      if(d.error){_m("FAIL: "+d.error,"#e44");return;}
      _m(d.msg||"Stopped","#0F0");
    }catch(e){logEl.textContent="Parse error: "+String(e);_m("ERROR","#e44");}
  };
  x.send("{}");
}
</script>
</body>
</html>
