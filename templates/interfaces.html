<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=240, height=320, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interfaces</title>
    <script>
        window.location.href = '2_interfaces.html';
    </script>
    <style>
        html, body {
            width: 240px;
            height: 320px;
            margin: 0;
            padding: 0;
            background: #222;
            color: #eee;
            font-family: Arial, Helvetica, sans-serif;
            overflow-y: auto;
            -webkit-text-size-adjust: none;
            text-size-adjust: none;
        }
        .container {
            width: 224px;
            margin: 8px auto 0 auto;
            padding: 8px 4px 12px 4px;
            background: #333;
            border-radius: 8px;
        }
        h1 {
            color: #0cf;
            font-size: 16px;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .iface {
            display: block;
                :root {
                  --nord0: #2E3440;
                  --nord1: #3B4252;
                  --nord2: #434C5E;
                  --nord3: #4C566A;
                  --nord4: #D8DEE9;
                  --nord5: #E5E9F0;
                  --nord6: #ECEFF4;
                  --nord7: #8FBCBB;
                  --nord8: #88C0D0;
                  --nord9: #81A1C1;
                  --nord10: #5E81AC;
                  --nord11: #BF616A;
                  --nord12: #D08770;
                  --nord13: #EBCB8B;
                  --nord14: #A3BE8C;
                  --nord15: #B48EAD;
                }
                *{box-sizing:border-box}
                html,body{
                    height:100%;
                    margin:0;
                    padding:0;
                    background:var(--nord0);
                    color:var(--nord4);
                    font-family: Arial, Helvetica, sans-serif;
                    overflow-y:auto;
                }
                body{padding:20px 10px 30px;}
                .head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--nord3);padding-bottom:10px;margin-bottom:18px;}
                .t1{color:var(--nord4);font-size:14px;font-weight:bold;letter-spacing:1px;text-shadow:0 0 2px var(--nord3);}
                .back{color:var(--nord8);text-decoration:none;border:1px solid var(--nord3);padding:5px 10px;font-size:11px;background:transparent;}
                .back:focus{background:var(--nord8);color:var(--nord0);}
                .payload-list{display:flex;flex-direction:column;gap:12px;margin-top:10px;}
                .acc-btn{width:100%;background:var(--nord1);color:var(--nord14);border:1px solid var(--nord8);padding:16px;text-align:left;font-size:15px;font-weight:bold;cursor:pointer;transition:background .15s, color .15s;}
                .acc-btn:focus,.acc-btn:hover{background:var(--nord8);color:var(--nord0);outline:none;}
                .beacon {color:var(--nord8);border-color:var(--nord8);}
                .beacon:focus,.beacon:hover {background:var(--nord8);color:var(--nord0);}
                .vuln {color:var(--nord15);border-color:var(--nord15);}
                .vuln:focus,.vuln:hover {background:var(--nord15);color:var(--nord0);}
                .evil {color:var(--nord13);border-color:var(--nord13);}
                .evil:focus,.evil:hover {background:var(--nord13);color:var(--nord0);}
                .deauth {color:var(--nord11);border-color:var(--nord11);}
                .deauth:focus,.deauth:hover {background:var(--nord11);color:var(--nord0);}
            border: none;
            padding: 8px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        button:disabled {
            background: #666;
            color: #ccc;
        }
        .back {
            display: block;
            margin: 12px auto 0 auto;
            text-align: center;
            color: #0cf;
            background: #444;
            border-radius: 4px;
            padding: 10px 0;
            width: 100%;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Interfaces</h1>
        <a href="success.html" class="back">&lt; DASHBOARD</a>
    </div>
</body>
</html>
