<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CyberPWN — WIFI SCAN</title>
<style>
*{box-sizing:border-box}
html,body{
    height:100%;
    margin:0;
    padding:0;
    background:#000;
    color:#fff;
    font-family: Arial, Helvetica, sans-serif;
    overflow:hidden;
}
#layout-table{width:100%;height:100%;border-collapse:collapse;}
td.center-cell{vertical-align:middle;text-align:center;padding-bottom:12px;}
.head-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.t1{color:#fff;font-size:12px;}
.back{color:#00ffe7;text-decoration:none;border:1px solid #00ffe7;padding:2px 6px;font-size:10px;background:transparent;}
.back:focus{background:#fff;color:#000;}
#list{width:100%;max-height:100px;background:#000;border:1px solid #fff;color:#fff;font-size:11px;padding:6px;overflow-y:scroll;text-align:left;white-space:pre-wrap;margin:6px auto;}
#d{background:#111;color:#00ffe7;font-size:18px;font-weight:bold;min-height:36px;width:220px;border:1px solid #00ffe7;margin:0 auto 4px auto;line-height:36px;letter-spacing:2px;text-align:center;}
#s{color:#fff;font-size:10px;min-height:14px;margin-bottom:6px;text-transform:uppercase;font-weight:bold;}
.keypad{margin:0 auto;width:220px;}
.keypad td{padding:2px;width:33%;}

/* wifi.html style: black bg, white border, colored text */
.b{width:100%;height:42px;background:#000;color:#00ffe7;font-size:18px;border:1px solid #fff;cursor:pointer;transition:background .15s, color .15s;}
.b:focus,.b:active{background:#fff;color:#000;outline:none;}
.cl{color:#ffd600;}
.en{color:#ff3c00;}
.scan{font-size:11px;color:#ff00c8;}
#d{background:#111;color:#00ffe7;font-size:18px;font-weight:bold;min-height:36px;width:220px;border:1px solid #00ffe7;margin:0 auto 4px auto;line-height:36px;letter-spacing:2px;text-align:center;}
</style>
<!-- System fonts only for compatibility -->
</head>
<body onload="_L()">
<table id="layout-table"><tr><td class="center-cell">
<div class="head-row">
    <span class="t1">WIFI SCAN</span>
    <a href="success.html" class="back">&lt; DASHBOARD</a>
</div>
<button type="button" class="b scan" onclick="_scan()" style="width:100%;margin-bottom:4px;">SCAN SSIDs</button>
<div id="list">Press SCAN to load networks (1–9).</div>
<div id="d"></div>
<div id="s">SELECT 1–9</div>
<table class="keypad" border="0" cellpadding="0" cellspacing="0">
<tr><td><button class="b" type="button" onclick="_a('1')">1</button></td><td><button class="b" type="button" onclick="_a('2')">2</button></td><td><button class="b" type="button" onclick="_a('3')">3</button></td></tr>
<tr><td><button class="b" type="button" onclick="_a('4')">4</button></td><td><button class="b" type="button" onclick="_a('5')">5</button></td><td><button class="b" type="button" onclick="_a('6')">6</button></td></tr>
<tr><td><button class="b" type="button" onclick="_a('7')">7</button></td><td><button class="b" type="button" onclick="_a('8')">8</button></td><td><button class="b" type="button" onclick="_a('9')">9</button></td></tr>
<tr><td><button class="b cl" type="button" onclick="_c()">X</button></td><td><button class="b" type="button" onclick="_scan()">SCAN</button></td><td><button class="b en" type="button" onclick="_v()">OK</button></td></tr>
</table>
</td></tr></table>
<script>
var _list=[],_sel=0;
function _L(){_m("SCAN ONLY (NO MONITOR MODE)","#555");}
function _a(n){var i=parseInt(n,10);if(i<1||i>9)return;if(_list.length<i){_m("NO SSID","#e44");return;}
_sel=i;_u();_m("SELECTED: "+i+" (SCAN ONLY)","#FCEE0A");}
function _c(){_sel=0;_u();_m("SELECT 1–9","#555");}
function _u(){var d=document.getElementById("d");if(_sel===0){d.innerHTML="";return;}
if(_list[_sel-1])d.innerHTML=_sel+": "+(_list[_sel-1].ssid||"").substring(0,14);else d.innerHTML=_sel;}
function _m(t,c){var s=document.getElementById("s");s.innerHTML=t;s.style.color=c;}
function _scan(){var listEl=document.getElementById("list");listEl.innerHTML="Scanning...";_m("SCANNING","#555");
var x=new XMLHttpRequest();x.open("GET","/api/scan_wifi_list",true);
x.onreadystatechange=function(){if(x.readyState!==4)return;
if(x.status!==200){listEl.innerHTML="Error "+x.status;_m("SCAN FAIL","#e44");return;}
try{_list=JSON.parse(x.responseText);if(!Array.isArray(_list))_list=[];
var txt="";for(var i=0;i<_list.length&&i<9;i++)txt+=(i+1)+". "+(_list[i].ssid||"?").substring(0,16)+" "+(_list[i].signal||"")+"%\n";
listEl.innerHTML=txt||"No networks.";_sel=0;_u();_m("SELECT 1–9","#555");}catch(e){listEl.innerHTML="Parse error";_m("ERROR","#e44");}};
x.send();}
function _v(){
  _m("NOT SUPPORTED (NO MONITOR MODE)","#e44");
}
</script>
</body>
</html>
