      letter-spacing: 4px;

      border-radius: 0;

      font-weight: bold;
      text-align: center;

    .b {

      height: 32px;

      color: var(--nord8);

      border: 1px solid #00FFE7;
      border: 1px solid var(--nord8);
      border-radius: 0;

      text-align: center;
      line-height: 32px;
      font-family: 'Cinzel Decorative', 'UnifrakturCook', serif;
      font-weight: bold;

      box-shadow: 0 0 4px #000a;
      letter-spacing: 1px;
      text-shadow: 0 0 2px var(--nord0);

      background: #00FFE7;
      background: var(--nord8);
      color: #000;
      color: var(--nord0);
      box-shadow: 0 0 8px #000a;

    .b.gothic-digit {

      text-shadow: 0 0 2px var(--nord0);

    .b.cl {
      color: var(--nord12);
      font-size: 13px;
      font-family: 'Cinzel Decorative', serif;
      text-shadow: 0 0 2px var(--nord0);

    .b.en {

      font-size: 13px;
      font-family: 'Cinzel Decorative', serif;
      text-shadow: 0 0 2px var(--nord0);
    }
</style>
