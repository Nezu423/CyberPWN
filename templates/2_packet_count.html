<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240, height=320, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Packet Count Results</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
      --nord0: #2E3440;
      --nord1: #3B4252;
      --nord2: #434C5E;
      --nord3: #4C566A;
      --nord4: #D8DEE9;
      --nord5: #E5E9F0;
      --nord6: #ECEFF4;
      --nord7: #8FBCBB;
      --nord8: #88C0D0;
      --nord9: #81A1C1;
      --nord10: #5E81AC;
      --nord11: #BF616A;
      --nord12: #D08770;
      --nord13: #EBCB8B;
      --nord14: #A3BE8C;
      --nord15: #B48EAD;
    }
    body {
      background: var(--nord0);
      color: var(--nord4);
      font-family: 'Montserrat', Arial, Helvetica, sans-serif;
      padding: 10px;
    }
    .result {
      background: var(--nord2);
      padding: 8px;
      border-radius: 6px;
      word-break: break-all;
    }
    .btn {
      margin-top: 12px;
      padding: 8px 16px;
      background: var(--nord8);
      color: var(--nord0);
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .btn:hover {
      background: var(--nord9);
    }
</style>
</head>
<body>
<h2>Packet Count Results</h2>
<div class="result" id="result">Loading...</div>
<button class="btn" onclick="location.href='success.html'">Back to Dashboard</button>
<script>
fetch('/api/sniffer/packet_count', {method:'POST'})
  .then(r=>r.json())
  .then(data=>{
    let html = '';
    if(data.ok) {
      html += `<b>Packets: ${data.count}</b><ul style='padding-left:16px;'>`;
      data.packets.forEach(pkt => html += `<li>${pkt}</li>`);
      html += '</ul>';
    } else {
      html = `<span style='color:#BF616A;'>Error: ${data.error}</span>`;
    }
    document.getElementById('result').innerHTML = html;
  })
  .catch(e=>{
    document.getElementById('result').innerHTML = '<span style="color:#BF616A;">Error: '+e+'</span>';
  });
</script>
</body>
</html>
