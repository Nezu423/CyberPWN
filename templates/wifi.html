<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CyberPWN — WIFI PAYLOADS</title>
<style>
    :root {
      --nord0: #000000;
      --nord1: #000000;
      --nord2: #000000;
      --nord3: #202020;
      --nord4: #EAEAEA;
      --nord5: #EAEAEA;
      --nord6: #EAEAEA;
      --nord7: #00FFE7;
      --nord8: #00FFE7;
      --nord9: #FF00C8;
      --nord10: #00FFE7;
      --nord11: #FF3C00;
      --nord12: #FFD600;
      --nord13: #FFD600;
      --nord14: #00FF5A;
      --nord15: #FF00C8;
    }
    *{box-sizing:border-box}
    html,body{
        height:100%;
        margin:0;
        padding:0;
        background:#000;
        background:var(--nord0);
        color:#fff;
        color:var(--nord4);
        font-family: Arial, Helvetica, sans-serif;
        overflow-y:auto;
    }
    a{color:#FFD600 !important;text-decoration:none;}
    a:visited{color:#FFD600 !important;}
    body{padding:12px 8px 18px;}
    .head{position:relative;border-bottom:1px solid #202020;border-bottom:1px solid var(--nord3);padding-bottom:10px;margin-bottom:18px;}
    .t1{display:block;padding-right:92px;color:#fff;color:var(--nord4);font-size:14px;font-weight:bold;letter-spacing:1px;text-shadow:0 0 2px #202020;text-shadow:0 0 2px var(--nord3);}
    .back{position:absolute;right:0;top:0;color:#00FFE7;color:var(--nord8);text-decoration:none;border:1px solid #202020;border:1px solid var(--nord3);padding:5px 10px;font-size:11px;background:transparent;}
    .back:focus{background:#00FFE7;background:var(--nord8);color:#000;color:var(--nord0);}
    .payload-list{margin-top:10px;}
    .acc-btn{display:block;width:100%;background:#000;background:var(--nord1);color:#00FF5A;color:var(--nord14);border:1px solid #00FFE7;border:1px solid var(--nord8);padding:16px;text-align:left;font-size:15px;font-weight:bold;cursor:pointer;}
    .acc-btn:focus,.acc-btn:hover{background:#00FFE7;background:var(--nord8);color:#000;color:var(--nord0);outline:none;}
    .beacon {color:#00FFE7;color:var(--nord8);border-color:#00FFE7;border-color:var(--nord8);}
    .beacon:focus,.beacon:hover {background:#00FFE7;background:var(--nord8);color:#000;color:var(--nord0);}
    .vuln {color:#FF00C8;color:var(--nord15);border-color:#FF00C8;border-color:var(--nord15);}
    .vuln:focus,.vuln:hover {background:#FF00C8;background:var(--nord15);color:#000;color:var(--nord0);}
    .evil {color:#FFD600;color:var(--nord13);border-color:#FFD600;border-color:var(--nord13);}
    .evil:focus,.evil:hover {background:#FFD600;background:var(--nord13);color:#000;color:var(--nord0);}
    .deauth {color:#FF3C00;color:var(--nord11);border-color:#FF3C00;border-color:var(--nord11);}
    .deauth:focus,.deauth:hover {background:#FF3C00;background:var(--nord11);color:#000;color:var(--nord0);}
</style>
<!-- System fonts only for compatibility -->
</head>
<body>
<div class="head">
    <span class="t1">WIFI PAYLOADS</span>
    <a href="success.html" class="back">&lt; DASHBOARD</a>
</div>

<div class="payload-list">
    <a class="acc-btn beacon" href="2_beacon_sniff.html">&gt; BEACON SNIFF</a>
</div>

<!-- Interface Management Section -->
<div style="margin-top:30px;border-top:1px solid #222;padding-top:20px;">
    <div class="head" style="border-bottom:none;margin-bottom:12px;">
        <span class="t1" style="font-size:13px;">INTERFACE STATUS</span>
        <button onclick="refreshInterfaces()" style="background:#000;color:#fff;border:1px solid #fff;padding:5px 10px;font-size:11px;cursor:pointer;">REFRESH</button>
    </div>

    <!-- Interface Status Cards -->
    <div id="interfaces-container" style="display:block;">
        <div style="color:#ccc;font-size:12px;text-align:center;">Loading interfaces...</div>
    </div>
</div>

<style>
.iface-card {
    background:#111;
    border:1px solid #333;
    padding:12px;
    border-radius:4px;
    font-size:12px;
    margin-bottom:10px;
}
.iface-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
}
.iface-name {
    color:#00ffe7;
    font-weight:bold;
    font-size:13px;
}
.iface-status {
    padding:3px 8px;
    border-radius:3px;
    font-size:10px;
    font-weight:bold;
}
.status-up {background:#0f0;color:#000;}
.status-down {background:#f00;color:#fff;}
.status-monitor {background:#ffd600;color:#000;}
.status-managed {background:#0cf;color:#000;}
.status-master {background:#ff00c8;color:#fff;}
.iface-details {
    color:#999;
    font-size:11px;
    line-height:1.6;
    margin-bottom:8px;
}
.iface-controls {
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}
.ctrl-btn {
    padding:6px 12px;
    border:1px solid #fff;
    background:#000;
    color:#fff;
    font-size:11px;
    cursor:pointer;
    border-radius:3px;
    transition:all .15s;
}
.ctrl-btn:hover,.ctrl-btn:focus {
    background:#fff;
    color:#000;
    outline:none;
}
.ctrl-btn:disabled {
    opacity:0.5;
    cursor:not-allowed;
}
.ctrl-btn.monitor {border-color:#ffd600;color:#ffd600;}
.ctrl-btn.monitor:hover,.ctrl-btn.monitor:focus {background:#ffd600;color:#000;}
.ctrl-btn.up {border-color:#0f0;color:#0f0;}
.ctrl-btn.up:hover,.ctrl-btn.up:focus {background:#0f0;color:#000;}
.ctrl-btn.down {border-color:#f00;color:#f00;}
.ctrl-btn.down:hover,.ctrl-btn.down:focus {background:#f00;color:#fff;}
</style>

<script>
function apiJson(method, url, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, url, true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return;
        if (xhr.status < 200 || xhr.status >= 300) {
            cb(new Error('HTTP ' + xhr.status), null);
            return;
        }
        try {
            cb(null, JSON.parse(xhr.responseText));
        } catch (e) {
            cb(e, null);
        }
    };
    xhr.send(null);
}

function refreshInterfaces() {
    apiJson('GET', '/api/interfaces/status', function(err, data) {
        if (err) {
            document.getElementById('interfaces-container').innerHTML = '<div style="color:#f00;">Error loading: ' + err + '</div>';
            return;
        }
        if (data && data.error) {
            document.getElementById('interfaces-container').innerHTML = '<div style="color:#f00;">Error: ' + data.error + '</div>';
            return;
        }

        // Update Interfaces
        var container = document.getElementById('interfaces-container');
        var interfaces = (data && data.interfaces) ? data.interfaces : {};
        var hasAny = false;
        for (var k in interfaces) { if (interfaces.hasOwnProperty(k)) { hasAny = true; break; } }
        if (!hasAny) {
            container.innerHTML = '<div style="color:#999;text-align:center;">No interfaces found</div>';
            return;
        }

        var html = '';
        for (var name in interfaces) {
            if (!interfaces.hasOwnProperty(name)) continue;
            var status = interfaces[name] || {};
            if (!status.exists) continue;

            var modeClass = status.mode === 'monitor' ? 'status-monitor' :
                            status.mode === 'master' ? 'status-master' :
                            status.mode === 'managed' ? 'status-managed' : '';
            var upClass = status.up ? 'status-up' : 'status-down';

            html += '<div class="iface-card">';
            html += '<div class="iface-header">';
            html += '<span class="iface-name">' + String(name).toUpperCase() + '</span>';
            html += '<span class="iface-status ' + upClass + '">' + (status.up ? 'UP' : 'DOWN') + '</span>';
            if (status.mode && status.mode !== 'unknown') {
                html += '<span class="iface-status ' + modeClass + '">' + String(status.mode).toUpperCase() + '</span>';
            }
            html += '</div>';

            html += '<div class="iface-details">';
            if (status.mac) html += 'MAC: ' + status.mac + '<br>';
            if (status.ip) html += 'IP: ' + status.ip + '<br>';
            if (status.ssid) html += 'SSID: ' + status.ssid + '<br>';
            if (status.channel) html += 'Channel: ' + status.channel + '<br>';
            if (status.frequency) html += 'Freq: ' + status.frequency + '<br>';
            if (status.signal) html += 'Signal: ' + status.signal;
            html += '</div>';

            html += '<div class="iface-controls">';
            if (status.up) {
                html += '<button class="ctrl-btn down" onclick="ifaceDown(\'' + name + '\')">DOWN</button>';
            } else {
                html += '<button class="ctrl-btn up" onclick="ifaceUp(\'' + name + '\')">UP</button>';
            }
            html += '</div>';
            html += '</div>';
        }

        container.innerHTML = html;
    });
}

function ifaceUp(iface) {
    apiJson('POST', '/api/interfaces/' + encodeURIComponent(iface) + '/up', function(err, data) {
        if (err) {
            alert('Error: ' + err);
            return;
        }
        if (data && data.ok) {
            refreshInterfaces();
        } else {
            alert('Error: ' + ((data && data.error) ? data.error : 'Failed'));
        }
    });
}

function ifaceDown(iface) {
    if (!confirm('Bring ' + iface + ' down?')) return;
    apiJson('POST', '/api/interfaces/' + encodeURIComponent(iface) + '/down', function(err, data) {
        if (err) {
            alert('Error: ' + err);
            return;
        }
        if (data && data.ok) {
            refreshInterfaces();
        } else {
            alert('Error: ' + ((data && data.error) ? data.error : 'Failed'));
        }
    });
}

// Auto-refresh every 3 seconds
setInterval(refreshInterfaces, 3000);
refreshInterfaces();
</script>

</body>
</html>
