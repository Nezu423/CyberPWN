<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CyberPWN — PAYLOADS</title>
<style>
* { box-sizing: border-box; }
html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: #0d0d0d;
    color: #AAA;
    font-family: monospace;
    overflow-y: auto;
}
body { padding: 20px 8px 30px; }

/* HEADER */
.head {
    border-bottom: 1px solid #2a2a2a;
    padding-bottom: 8px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.t1 { color: #FCEE0A; font-size: 14px; font-weight: bold; }
.back {
    color: #555;
    text-decoration: none;
    border: 1px solid #2a2a2a;
    padding: 4px 8px;
    font-size: 11px;
}
.back:focus { background: #FCEE0A; color: #000; }

/* ACCORDION BUTTONS */
.acc-btn {
    width: 100%;
    background: #1a1a1a;
    color: #CCC;
    border: 1px solid #2a2a2a;
    padding: 12px;
    text-align: left;
    font-size: 14px;
    font-weight: bold;
    margin-top: 8px;
    cursor: pointer;
}
.acc-btn:focus {
    background: #FCEE0A;
    color: #000;
    outline: none;
}

/* ACTION BUTTONS inside panels */
.action-btn {
    width: 100%;
    padding: 10px;
    background: #333;
    color: #FFF;
    border: 1px solid #555;
    margin-top: 5px;
    font-weight: bold;
    cursor: pointer;
}
.action-btn:focus {
    background: #FCEE0A;
    color: #000;
}

/* SCROLLABLE LOG BOX */
.panel {
    display: none;
    background: #111;
    border: 1px solid #2a2a2a;
    padding: 10px;
}
.log-box {
    width: 100%;
    height: 150px;
    background: #0a0a0a;
    border: 1px solid #2a2a2a;
    color: #0F0;
    font-size: 12px;
    padding: 5px;
    overflow-y: scroll; /* Force scrollbar behavior */
    white-space: pre-wrap;
    margin-top: 5px;
    line-height: 1.5;
}
/* Highlight focus so you know when you can scroll with D-PAD */
.log-box:focus {
    border: 1px solid #FCEE0A;
    outline: none;
}
</style>
</head>
<body>

<div class="head">
    <div class="t1">LIVE_OPS — PAYLOADS</div>
    <a href="success.html" class="back">&lt; DASHBOARD</a>
</div>

<button class="acc-btn" onclick="openP('p1')">&gt; WIFI_SCANNER</button>
<div id="p1" class="panel">
    <button class="action-btn" onclick="req('/api/scan_wifi','ssid-log')">SCAN AREA</button>
    <div id="ssid-log" class="log-box" tabindex="0">READY</div>
</div>

<button class="acc-btn" onclick="openP('p2')">&gt; VULN_CHECK (NMAP)</button>
<div id="p2" class="panel">
    <div style="font-size:10px;color:#666;margin-bottom:5px">Ports: 21 FTP, 23 Telnet, 445 SMB, 3389 RDP, 8080</div>
    <button class="action-btn" onclick="req('/api/nmap','port-log')">SCAN NETWORK</button>
    <div id="port-log" class="log-box" tabindex="0">READY</div>
</div>

<script>
function openP(id){
    // 1. Get the panel user clicked
    var p = document.getElementById(id);
    var current = p.style.display;
    
    // 2. Close ALL panels first (accordion style)
    var all = document.getElementsByClassName("panel");
    for(var i=0; i<all.length; i++) {
        all[i].style.display = "none";
    }
    
    // 3. Open the requested one if it was closed
    if(current !== "block"){
        p.style.display = "block";
    }
}

function req(endpoint, logId){
    var log = document.getElementById(logId);
    var isSlow = endpoint.indexOf('nmap') !== -1;
    log.innerHTML = isSlow ? "SCANNING... (MAY TAKE 30s)" : "Loading...";

    var x = new XMLHttpRequest();
    x.open("GET", endpoint, true);
    x.timeout = isSlow ? 60000 : 15000;

    x.onreadystatechange = function(){
        if(x.readyState !== 4) return;
        if(x.status === 200){
            try {
                var d = JSON.parse(x.responseText);
                if(Array.isArray(d)){
                    log.innerHTML = "";
                    for(var i=0; i<d.length; i++) log.innerHTML += d[i] + "\n";
                } else {
                    log.innerHTML = d.log || d.status || JSON.stringify(d);
                }
                log.focus();
            } catch(e) {
                log.innerHTML = "DATA ERROR";
            }
        } else {
            log.innerHTML = "ERROR: " + x.status;
        }
    };
    x.ontimeout = function(){ log.innerHTML = "TIMEOUT"; };
    x.send();
}
</script>
</body>
</html>
